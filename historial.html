<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Accesos</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; padding: 20px; }
        .container { max-width: 500px; margin: auto; }
        .log-item { 
            background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 10px; 
            display: flex; justify-content: space-between; align-items: center;
            border-left: 6px solid #475569;
        }
        .PERMITIDO { border-left-color: #22c55e; }
        .DENEGADO { border-left-color: #ef4444; }
        .badge { padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
        .bg-ok { background: #064e3b; color: #4ade80; }
        .bg-no { background: #450a0a; color: #f87171; }
        .info { line-height: 1.4; }
        .time { color: #94a3b8; font-size: 0.8rem; }
        .error-box { background: #450a0a; color: #f87171; padding: 15px; border-radius: 10px; border: 1px solid #ef4444; }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="color: #22c55e;">📋 Registro de Caseta</h2>
        <hr style="border: 0; border-top: 1px solid #334155; margin-bottom: 20px;">
        
        <div id="contenedor-logs">
            <p style="text-align: center; color: #94a3b8;">Conectando con la base de datos...</p>
        </div>
    </div>

    <script type="module">
        import { db } from "./firebase.js";
        import { collection, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Referencia al div
        const contenedor = document.getElementById("contenedor-logs");

        // Función para renderizar el historial
        function cargarHistorial() {
            try {
                // Consulta ordenada por tiempo (necesitará índice si falla)
                const q = query(
                    collection(db, "historial_accesos"), 
                    orderBy("timestamp", "desc"), 
                    limit(40)
                );

                onSnapshot(q, (snapshot) => {
                    if (snapshot.empty) {
                        contenedor.innerHTML = "<p style='text-align:center; color:#64748b;'>No hay eventos registrados.</p>";
                        return;
                    }

                    contenedor.innerHTML = ""; // Limpiar mensaje de carga

                    snapshot.forEach((doc) => {
                        const item = doc.data();
                        const fecha = item.timestamp ? new Date(item.timestamp).toLocaleString('es-MX') : "---";
                        
                        const div = document.createElement("div");
                        div.className = `log-item ${item.resultado}`;
                        div.innerHTML = `
                            <div class="info">
                                <strong>${item.nombre || "Desconocido"}</strong><br>
                                <span class="time">${fecha}</span><br>
                                <small style="color:#94a3b8">Casa: ${item.casa || "N/A"} | ${item.motivo || ""}</small>
                            </div>
                            <span class="badge ${item.resultado === 'PERMITIDO' ? 'bg-ok' : 'bg-no'}">
                                ${item.resultado}
                            </span>
                        `;
                        contenedor.appendChild(div);
                    });
                }, (error) => {
                    console.error("Error de Firebase:", error);
                    if (error.code === 'permission-denied') {
                        contenedor.innerHTML = `
                            <div class="error-box">
                                <b>Acceso Denegado:</b><br>
                                Debes actualizar las Reglas de Seguridad en tu consola de Firebase.
                            </div>`;
                    } else {
                        contenedor.innerHTML = `<div class="error-box">Error: ${error.message}</div>`;
                    }
                });
            } catch (err) {
                console.error("Error crítico:", err);
                contenedor.innerHTML = "<div class='error-box'>Error al inicializar el script.</div>";
            }
        }

        cargarHistorial();
    </script>
</body>
</html>
