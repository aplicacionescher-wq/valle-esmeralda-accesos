<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Historial</title>
<link rel="stylesheet" href="estilos.css">
</head>

<body>

<div class="container">

<h2>Historial</h2>

<button onclick="cargarDatos()">Cargar</button>

<table border="1" style="width:100%">
<thead>
<tr>
<th>Nombre</th>
<th>Casa</th>
<th>Autoriza</th>
<th>Tipo</th>
<th>Fecha</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

</div>

<script type="module">

import { db } from "./firebase.js"
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"

window.cargarDatos = async function(){

let tabla = document.getElementById("tabla")
tabla.innerHTML = ""

let snap = await getDocs(collection(db,"registroAccesos"))

snap.forEach(doc => {
let d = doc.data()

tabla.innerHTML += `
<tr>
<td>${d.nombre}</td>
<td>${d.casa}</td>
<td>${d.autoriza}</td>
<td>${d.tipo}</td>
<td>${new Date(d.fecha).toLocaleString()}</td>
</tr>`
})

}

</script>

</body>
</html>
