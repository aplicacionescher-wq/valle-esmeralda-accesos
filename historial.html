<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log de Accesos - Valle Esmeralda</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; padding: 20px; }
        .log-item { 
            background: #1e293b; 
            padding: 15px; 
            border-radius: 10px; 
            margin-bottom: 8px; 
            display: flex; 
            justify-content: space-between;
            align-items: center;
            border-left: 6px solid #ccc;
        }
        .PERMITIDO { border-left-color: #22c55e; }
        .DENEGADO { border-left-color: #ef4444; }
        .badge { padding: 4px 8px; border-radius: 5px; font-size: 0.7rem; font-weight: bold; }
        .bg-ok { background: #064e3b; color: #22c55e; }
        .bg-no { background: #450a0a; color: #f87171; }
        small { color: #94a3b8; }
    </style>
</head>
<body>
    <h2>📋 Registro de Caseta</h2>
    <div id="contenedor-logs">Cargando eventos...</div>

    <script type="module">
        import { db } from "./firebase.js";
        import { collection, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const contenedor = document.getElementById("contenedor-logs");
        const q = query(collection(db, "historial_accesos"), orderBy("timestamp", "desc"), limit(50));

        onSnapshot(q, (snapshot) => {
            contenedor.innerHTML = "";
            snapshot.forEach((doc) => {
                const item = doc.data();
                const hora = new Date(item.timestamp).toLocaleTimeString();
                
                const div = document.createElement("div");
                div.className = `log-item ${item.resultado}`;
                div.innerHTML = `
                    <div>
                        <strong>${item.nombre}</strong> <small>(Casa ${item.casa})</small><br>
                        <small>${hora} - ${item.motivo}</small>
                    </div>
                    <span class="badge ${item.resultado === 'PERMITIDO' ? 'bg-ok' : 'bg-no'}">
                        ${item.resultado}
                    </span>
                `;
                contenedor.appendChild(div);
            });
        });
    </script>
</body>
</html>
