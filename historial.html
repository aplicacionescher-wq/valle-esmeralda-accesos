<script type="module">
    import { db } from "./firebase.js";
    import { collection, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const contenedor = document.getElementById("contenedor-logs");

    try {
        const q = query(
            collection(db, "historial_accesos"), 
            orderBy("timestamp", "desc"), 
            limit(50)
        );

        onSnapshot(q, (snapshot) => {
            if (snapshot.empty) {
                contenedor.innerHTML = "<p style='text-align:center; color:#94a3b8;'>No hay registros de acceso aún.</p>";
                return;
            }

            contenedor.innerHTML = ""; // Limpiar el "Cargando..."
            snapshot.forEach((doc) => {
                const item = doc.data();
                const hora = item.timestamp ? new Date(item.timestamp).toLocaleString() : "Sin fecha";
                
                const div = document.createElement("div");
                div.className = `log-item ${item.resultado}`;
                div.innerHTML = `
                    <div>
                        <strong style="color:white;">${item.nombre || 'Desconocido'}</strong> 
                        <br><small>Casa: ${item.casa || 'N/A'}</small>
                        <br><small style="color:#94a3b8;">${hora}</small>
                        <br><small style="font-style:italic;">Motivo: ${item.motivo || 'N/A'}</small>
                    </div>
                    <span class="badge ${item.resultado === 'PERMITIDO' ? 'bg-ok' : 'bg-no'}">
                        ${item.resultado}
                    </span>
                `;
                contenedor.appendChild(div);
            });
        }, (error) => {
            // ESTO TE DIRÁ EL ERROR EN PANTALLA
            console.error("Error en Firebase:", error);
            contenedor.innerHTML = `<div style="color:#ef4444; padding:10px; background:#450a0a; border-radius:10px;">
                <b>Error de Firebase:</b><br>${error.message}
            </div>`;
        });
    } catch (err) {
        contenedor.innerHTML = "Error crítico al cargar el script.";
        console.error(err);
    }
</script>
