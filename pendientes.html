<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitas Pendientes - Valle Esmeralda</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --success: #22c55e;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 500px; margin: auto; }
        h2 { text-align: center; color: var(--accent); }
        
        .card-visita {
            background: var(--card);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 5px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .info b { display: block; font-size: 1.1rem; }
        .info span { font-size: 0.85rem; color: #94a3b8; }
        
        .btn-check {
            background: var(--success);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .vacio { text-align: center; padding: 50px; color: #64748b; }
        .btn-back { color: var(--text); text-decoration: none; font-size: 14px; display: block; margin-bottom: 20px; }
    </style>

    <script type="module">
        import { db } from "./firebase.js";
        import { 
            collection, 
            query, 
            where, 
            onSnapshot, 
            orderBy, 
            doc, 
            updateDoc 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const contenedor = document.getElementById("lista-pendientes");

        // Escuchamos la colección "visitas" donde el estado NO sea "usado"
        // Esto mostrará todo lo que esté "pendiente" o sin estado definido aún
        const q = query(
            collection(db, "visitas"), 
            where("estado", "!=", "usado"),
            orderBy("estado"),
            orderBy("timestamp", "desc")
        );

        onSnapshot(q, (snapshot) => {
            contenedor.innerHTML = "";

            if (snapshot.empty) {
                contenedor.innerHTML = '<div class="vacio">✅ No hay visitas por llegar</div>';
                return;
            }

            snapshot.forEach((docSnap) => {
                const item = docSnap.data();
                const id = docSnap.id;
                const hora = new Date(item.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                const div = document.createElement("div");
                div.className = "card-visita";
                div.innerHTML = `
                    <div class="info">
                        <b>${item.nombre}</b>
                        <span>🏠 Casa: ${item.casa} | 🚗 ${item.tipo}</span>
                        <span>⏰ Generado: ${hora}</span>
                    </div>
                    <button class="btn-check" id="btn-${id}">Ingresó</button>
                `;
                
                contenedor.appendChild(div);

                // Asignar evento al botón
                div.querySelector(`#btn-${id}`).onclick = () => marcarEntrada(id);
            });
        }, (error) => {
            console.log("Error:", error);
            contenedor.innerHTML = '<div class="vacio">Error al cargar datos. Verifica índices en Firebase.</div>';
        });

        async function marcarEntrada(id) {
            if(confirm("¿Confirmar ingreso de esta visita?")) {
                const ref = doc(db, "visitas", id);
                await updateDoc(ref, { estado: "usado" });
            }
        }
    </script>
</head>
<body>

    <div class="container">
        <a href="escaner.html" class="btn-back">⬅ Volver</a>
        <h2>⏳ Visitas por Llegar</h2>
        <div id="lista-pendientes">
            <div class="vacio">Cargando...</div>
        </div>
    </div>

</body>
</html>
