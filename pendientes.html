<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Visitas Pendientes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Estilos -->
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
      border-left: 5px solid #38bdf8;
    }

    .card span {
      display: block;
      margin-top: 5px;
    }

    .vacio {
      text-align: center;
      margin-top: 50px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <h1>📋 Visitas Pendientes</h1>

  <div id="contenedor"></div>

  <div id="mensaje" class="vacio" style="display:none;">
    No hay visitas pendientes
  </div>

  <!-- Firebase -->
  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      query,
      where,
      orderBy,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // 🔥 TU CONFIG (NO CAMBIAR)
    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "TU_DOMINIO",
      projectId: "TU_PROJECT_ID",
      storageBucket: "TU_BUCKET",
      messagingSenderId: "TU_ID",
      appId: "TU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const contenedor = document.getElementById("contenedor");
    const mensaje = document.getElementById("mensaje");

    // 🔥 CONSULTA CORRECTA (SIN FALLAR)
    const q = query(
      collection(db, "visitas"),
      where("estado", "==", "pendiente"),
      orderBy("timestamp", "desc")
    );

    onSnapshot(q, (snapshot) => {

      contenedor.innerHTML = "";

      if (snapshot.empty) {
        mensaje.style.display = "block";
        return;
      }

      mensaje.style.display = "none";

      snapshot.forEach((doc) => {

        const data = doc.data();

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <strong>${data.nombre || "Sin nombre"}</strong>
          <span>🏠 Casa: ${data.casa || "N/A"}</span>
          <span>📅 Fecha: ${data.fecha || "N/A"}</span>
          <span>📌 Estado: ${data.estado}</span>
        `;

        contenedor.appendChild(card);
      });

    });

  </script>

</body>
</html>
