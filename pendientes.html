<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendientes - Valle Esmeralda Residencial</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #f1f5f9; display: flex; }
        
        /* BARRA LATERAL CON LOGO INTEGRADO */
        .sidebar { width: 220px; background: #1e293b; color: white; height: 100vh; padding: 20px; position: fixed; display: flex; flex-direction: column; align-items: center; border-right: 1px solid #334155; }
        
        .sidebar-logo { margin-bottom: 30px; text-align: center; border-bottom: 1px solid #334155; padding-bottom: 20px; width: 100%; }
        .sidebar-logo img { max-width: 150px; height: auto; }
        
        .sidebar-links { width: 100%; }
        .sidebar a { display: block; color: #cbd5f5; text-decoration: none; padding: 12px; border-radius: 8px; margin-bottom: 10px; transition: 0.3s; font-size: 14px; }
        .sidebar a:hover { background: #334155; color: #38bdf8; }
        .sidebar a.active { background: #0f172a; color: #00a99d; font-weight: bold; } /* Verde Esmeralda */
        
        .main { margin-left: 260px; width: calc(100% - 260px); padding: 20px; }
        
        /* HEADER ESTANDARIZADO */
        .header { background: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .contador-box { background: #0f172a; color: #38bdf8; padding: 6px 16px; border-radius: 20px; font-weight: bold; }
        
        /* TARJETAS DE VISITA CON ACENTO VERDE */
        .card-visita { background: white; padding: 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 6px solid #00a99d; }
        .info b { font-size: 1.2rem; color: #0f172a; display: block; margin-bottom: 4px; }
        .info p { margin: 0; color: #64748b; font-size: 0.9rem; }
        
        /* BOTONES */
        .btn-group { display: flex; gap: 10px; }
        .btn { padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 13px; text-transform: uppercase; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .aprobar { background: #00a99d; color: white; } /* Verde Esmeralda */
        .aprobar:hover { background: #008f85; }
        
        .cancelar { background: #ec008c; color: white; } /* Rosa */
        .cancelar:hover { background: #cd007a; }
        
        .vacio { text-align: center; padding: 80px; color: #94a3b8; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo">
            <img src="logo.png" alt="Logo Valle Esmeralda">
        </div>
        <div class="sidebar-links">
            <a href="escaner.html">🏠 Escáner QR</a>
            <a href="pendientes.html" class="active">📋 Ver Pendientes</a>
            <a href="admin.html" id="linkAdmin" style="display:none;">📊 Admin General</a>
            <a onclick="cerrarSesion()" style="color:#ec008c; cursor:pointer; margin-top:30px; display:block; padding:12px; font-weight:bold;">🚪 Cerrar Sesión</a>
        </div>
    </div>

    <div class="main">
        <div class="header">
            <h2 style="margin:0; color:#0f172a;">📋 Visitas por Llegar</h2>
            <div class="contador-box">Pendientes: <span id="contador">0</span></div>
        </div>

        <div id="contenedor-pendientes">
            <div class="vacio">Sincronizando con la entrada...</div>
        </div>
    </div>

    <script type="module">
        import { db } from "./firebase.js";
        import { collection, query, where, onSnapshot, orderBy, doc, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- SEGURIDAD Y NAVEGACIÓN ---
        const rol = localStorage.getItem("rol");
        if(!localStorage.getItem("usuario")) window.location.href = "index.html";
        if(rol === "admin") document.getElementById("linkAdmin").style.display = "block";

        window.cerrarSesion = () => {
            localStorage.clear();
            window.location.href = "index.html";
        };

        const contenedor = document.getElementById("contenedor-pendientes");
        const contadorLabel = document.getElementById("contador");

        // --- CONSULTA EN TIEMPO REAL ---
        const q = query(
            collection(db, "visitas"), 
            where("estado", "==", "pendiente"),
            orderBy("timestamp", "desc")
        );

        onSnapshot(q, (snapshot) => {
            contenedor.innerHTML = "";
            let totalActivos = 0;
            const ahora = Date.now();
            const limite12h = 12 * 60 * 60 * 1000;

            if (snapshot.empty) {
                contenedor.innerHTML = '<div class="vacio">✅ Todo al día. No hay visitas pendientes.</div>';
                contadorLabel.innerText = "0";
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;

                // VALIDACIÓN AUTOMÁTICA DE 12 HORAS
                if (data.timestamp && (ahora - data.timestamp) > limite12h) {
                    updateDoc(doc(db, "visitas", id), { estado: "expirado" });
                    return; 
                }

                totalActivos++;
                const horaLocal = new Date(data.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                const card = document.createElement("div");
                card.className = "card-visita";
                card.innerHTML = `
                    <div class="info">
                        <b>${data.nombre}</b>
                        <p>🏠 Casa: ${data.casa} | ⏰ Generado: ${horaLocal} | 🚗 ${data.tipo.toUpperCase()}</p>
                    </div>
                    <div class="btn-group">
                        <button class="btn aprobar" id="in-${id}">Ingresó</button>
                        <button class="btn cancelar" id="can-${id}">Cancelar</button>
                    </div>
                `;
                contenedor.appendChild(card);

                // EVENTO: MARCAR INGRESO
                document.getElementById(`in-${id}`).onclick = async () => {
                    if(confirm(`¿Confirmar ingreso manual de ${data.nombre}?`)) {
                        try {
                            await updateDoc(doc(db, "visitas", id), { 
                                estado: "usado",
                                fechaEntrada: Date.now()
                            });

                            await addDoc(collection(db, "historial_accesos"), {
                                nombre: data.nombre,
                                casa: data.casa,
                                resultado: "PERMITIDO",
                                motivo: "Ingreso Manual (Panel)",
                                timestamp: Date.now(),
                                guardia: localStorage.getItem("usuario") || "Caseta"
                            });
                        } catch (e) {
                            console.error(e);
                            alert("Error al actualizar.");
                        }
                    }
                };

                // EVENTO: CANCELAR
                document.getElementById(`can-${id}`).onclick = async () => {
                    if(confirm(`¿Deseas cancelar el pase de ${data.nombre}?`)) {
                        try {
                            await updateDoc(doc(db, "visitas", id), { estado: "cancelado" });

                            await addDoc(collection(db, "historial_accesos"), {
                                nombre: data.nombre,
                                casa: data.casa,
                                resultado: "DENEGADO",
                                motivo: "Cancelado manualmente",
                                timestamp: Date.now(),
                                guardia: localStorage.getItem("usuario") || "Caseta"
                            });
                        } catch (e) {
                            console.error(e);
                        }
                    }
                };
            });
            contadorLabel.innerText = totalActivos;
        }, (error) => {
            console.error(error);
            if(error.message.includes("index")) {
                contenedor.innerHTML = '<div class="vacio">⚠️ Error de índice. Revisa la consola (F12).</div>';
            }
        });
    </script>
</body>
</html>
