<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Visitas Pendientes</title>

<script type="module">
import { db } from "./firebase.js";
import {
  collection,
  query,
  orderBy,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const contenedor = document.getElementById("lista");

const q = query(
  collection(db, "visitas"),
  orderBy("timestamp", "desc")
);

onSnapshot(q, (snapshot) => {

  contenedor.innerHTML = "";

  if (snapshot.empty) {
    contenedor.innerHTML = "<p style='text-align:center'>No hay visitas pendientes</p>";
    return;
  }

  snapshot.forEach(doc => {
    const data = doc.data();

    if (data.estado === "pendiente") {

      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <h3>${data.nombre}</h3>
        <p><b>Casa:</b> ${data.casa}</p>
        <p><b>Tipo:</b> ${data.tipo}</p>
        <p><b>Fecha:</b> ${data.fecha}</p>
        <p class="pendiente">PENDIENTE</p>
      `;

      contenedor.appendChild(card);
    }

  });

});
</script>

<style>
body {
  font-family: Arial;
  background: #f5f5f5;
  margin: 0;
}

header {
  background: #1e3a8a;
  color: white;
  padding: 15px;
  text-align: center;
}

#lista {
  padding: 15px;
}

.card {
  background: white;
  margin-bottom: 10px;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

.pendiente {
  color: orange;
  font-weight: bold;
}

.volver {
  display: block;
  margin: 15px;
  padding: 10px;
  background: #1e3a8a;
  color: white;
  text-align: center;
  border-radius: 8px;
  text-decoration: none;
}
</style>
</head>

<body>

<header>
  <h2>📋 Visitas Pendientes</h2>
</header>

<a class="volver" href="index.html">⬅ Volver</a>

<div id="lista"></div>

</body>
</html>
