<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitas Pendientes</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        .card { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 6px solid #38bdf8; }
        .info b { font-size: 1.2rem; color: #38bdf8; display: block; }
        .btn-ok { background: #22c55e; color: white; border: none; padding: 12px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .vacio { text-align: center; padding: 50px; color: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <h2>⏳ Visitas por Llegar</h2>
        <div id="lista-pendientes"><div class="vacio">Cargando...</div></div>
    </div>

    <script type="module">
        import { db } from "./firebase.js";
        import { collection, query, where, onSnapshot, doc, updateDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const contenedor = document.getElementById("lista-pendientes");

        const q = query(
            collection(db, "visitas"), 
            where("estado", "==", "pendiente"),
            orderBy("timestamp", "desc")
        );

        onSnapshot(q, (snapshot) => {
            contenedor.innerHTML = "";
            if (snapshot.empty) {
                contenedor.innerHTML = '<div class="vacio">✅ No hay visitas pendientes</div>';
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                const div = document.createElement("div");
                div.className = "card";
                div.innerHTML = `
                    <div class="info">
                        <b>${data.nombre}</b>
                        <span>🏠 Casa: ${data.casa} | 🚗 ${data.tipo}</span>
                    </div>
                    <button class="btn-ok" id="btn-${id}">Ingresó</button>
                `;
                contenedor.appendChild(div);

                div.querySelector(`#btn-${id}`).onclick = async () => {
                    if(confirm("¿Confirmar ingreso?")) {
                        await updateDoc(doc(db, "visitas", id), { estado: "usado" });
                    }
                };
            });
        });
    </script>
</body>
</html>
