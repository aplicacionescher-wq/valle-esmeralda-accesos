<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de Pendientes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      padding: 20px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 {
      margin: 0;
    }

    button {
      background: #38bdf8;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    input {
      padding: 8px;
      border-radius: 6px;
      border: none;
    }

    .contador {
      font-size: 18px;
      margin-top: 10px;
      color: #38bdf8;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      margin-top: 10px;
      border-radius: 10px;
      border-left: 5px solid #38bdf8;
    }

    .card span {
      display: block;
      margin-top: 5px;
    }

    .acciones {
      margin-top: 10px;
    }

    .btn-ok {
      background: #22c55e;
      color: white;
    }

    .vacio {
      text-align: center;
      margin-top: 40px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <div class="top">
    <h1>📋 Pendientes</h1>

    <div>
      <input type="text" id="filtroCasa" placeholder="Filtrar por casa">
      <button onclick="volver()">⬅ Volver</button>
    </div>
  </div>

  <div class="contador">
    Pendientes: <span id="total">0</span>
  </div>

  <div id="contenedor"></div>

  <div id="mensaje" class="vacio" style="display:none;">
    No hay pendientes
  </div>

  <!-- 🔔 sonido -->
  <audio id="sonido" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      query,
      orderBy,
      onSnapshot,
      doc,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "TU_DOMINIO",
      projectId: "TU_PROJECT_ID",
      storageBucket: "TU_BUCKET",
      messagingSenderId: "TU_ID",
      appId: "TU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const contenedor = document.getElementById("contenedor");
    const mensaje = document.getElementById("mensaje");
    const totalSpan = document.getElementById("total");
    const filtroInput = document.getElementById("filtroCasa");
    const sonido = document.getElementById("sonido");

    let ultimaCantidad = 0;

    const q = query(
      collection(db, "visitas"),
      orderBy("fecha", "desc")
    );

    onSnapshot(q, (snapshot) => {

      contenedor.innerHTML = "";
      let total = 0;

      snapshot.forEach((docSnap) => {

        const data = docSnap.data();
        const id = docSnap.id;

        const estado = data.estado || "pendiente";

        if (estado !== "pendiente") return;

        const filtro = filtroInput.value.toLowerCase();

        if (filtro && !(data.casa || "").toLowerCase().includes(filtro)) return;

        total++;

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <strong>${data.nombre || "Sin nombre"}</strong>
          <span>🏠 Casa: ${data.casa || "N/A"}</span>
          <span>📅 Fecha: ${data.fecha || "N/A"}</span>

          <div class="acciones">
            <button class="btn-ok" onclick="atender('${id}')">
              ✔ Atender
            </button>
          </div>
        `;

        contenedor.appendChild(card);
      });

      totalSpan.innerText = total;

      if (total === 0) {
        mensaje.style.display = "block";
      } else {
        mensaje.style.display = "none";
      }

      // 🔔 sonido si llegan nuevos
      if (total > ultimaCantidad) {
        sonido.play();
      }

      ultimaCantidad = total;

    });

    // 🔥 marcar como usado
    window.atender = async (id) => {
      await updateDoc(doc(db, "visitas", id), {
        estado: "usado"
      });
    };

    // 🔙 volver
    window.volver = () => {
      window.location.href = "index.html";
    };

    // 🔎 filtro en vivo
    filtroInput.addEventListener("input", () => {
      location.reload();
    });

  </script>

</body>
</html>
