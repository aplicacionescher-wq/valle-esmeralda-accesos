<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel - Visitas Pendientes</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Arial; background: #f1f5f9; display: flex; }
        .sidebar { width: 220px; background: #0f172a; color: white; height: 100vh; padding: 20px; position: fixed; }
        .sidebar h2 { font-size: 18px; margin-bottom: 20px; }
        .sidebar a { display: block; color: #cbd5f5; text-decoration: none; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .main { margin-left: 240px; width: 100%; padding: 20px; }
        .header { background: white; padding: 15px; display: flex; justify-content: space-between; border-radius: 10px; margin-bottom: 20px; }
        
        .card-visita { background: white; padding: 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .info b { font-size: 1.1rem; color: #0f172a; }
        
        .btn-group { display: flex; gap: 10px; }
        .btn { padding: 10px 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .aprobar { background: #22c55e; color: white; }
        .aprobar:hover { background: #16a34a; }
        
        .cancelar { background: #ef4444; color: white; }
        .cancelar:hover { background: #dc2626; }
        
        .vacio { text-align: center; padding: 40px; color: #64748b; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>🏢 Valle Esmeralda</h2>
        <a href="index.html">🏠 Inicio</a>
        <a href="pendientes.html" style="background: #1e293b;">📋 Pendientes</a>
        <a href="admin.html">📊 Admin General</a>
    </div>

    <div class="main">
        <div class="header">
            <div style="font-size: 20px; font-weight: bold;">📋 Visitas por Llegar</div>
            <div>Pendientes: <span id="contador">0</span></div>
        </div>

        <div id="contenedor-pendientes">
            <div class="vacio">Cargando datos de caseta...</div>
        </div>
    </div>

    <script type="module">
        import { db } from "./firebase.js";
        import { 
            collection, 
            query, 
            where, 
            onSnapshot, 
            orderBy, 
            doc, 
            updateDoc,
            addDoc 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const contenedor = document.getElementById("contenedor-pendientes");
        const contador = document.getElementById("contador");

        // Escucha en tiempo real de visitas con estado 'pendiente'
        const q = query(
            collection(db, "visitas"), 
            where("estado", "==", "pendiente"),
            orderBy("timestamp", "desc")
        );

        onSnapshot(q, (snapshot) => {
            contenedor.innerHTML = "";
            let total = 0;

            if (snapshot.empty) {
                contenedor.innerHTML = `<div class="vacio">✅ No hay visitas pendientes en este momento.</div>`;
                contador.innerText = "0";
                return;
            }

            snapshot.forEach((docSnap) => {
                total++;
                const data = docSnap.data();
                const id = docSnap.id;
                const hora = data.timestamp ? new Date(data.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '--:--';

                const card = document.createElement("div");
                card.className = "card-visita";
                card.innerHTML = `
                    <div class="info">
                        <b>${data.nombre}</b><br>
                        <small>🏠 Casa: ${data.casa} | ⏰ ${hora} | 🚗 ${data.tipo.toUpperCase()}</small>
                    </div>
                    <div class="btn-group">
                        <button class="btn aprobar" data-id="${id}" id="ingreso-${id}">Marcar Ingreso</button>
                        <button class="btn cancelar" data-id="${id}" id="cancelar-${id}">Cancelar</button>
                    </div>
                `;
                contenedor.appendChild(card);

                // FUNCIÓN PARA INGRESAR
                document.getElementById(`ingreso-${id}`).onclick = async (e) => {
                    const btn = e.target;
                    if(confirm(`¿Confirmar ingreso de ${data.nombre}?`)) {
                        try {
                            btn.disabled = true;
                            btn.innerText = "⏳...";
                            
                            const docRef = doc(db, "visitas", id);
                            await updateDoc(docRef, { 
                                estado: "usado",
                                fechaEntrada: Date.now()
                            });

                            // Opcional: Registrar en historial_accesos
                            await addDoc(collection(db, "historial_accesos"), {
                                nombre: data.nombre,
                                casa: data.casa,
                                resultado: "PERMITIDO",
                                motivo: "Ingreso Manual Caseta",
                                timestamp: Date.now(),
                                guardia: localStorage.getItem("usuario") || "Caseta"
                            });

                        } catch (error) {
                            console.error("Error al marcar ingreso:", error);
                            alert("No se pudo actualizar. Intente de nuevo.");
                            btn.disabled = false;
                            btn.innerText = "Marcar Ingreso";
                        }
                    }
                };

                // FUNCIÓN PARA CANCELAR
                document.getElementById(`cancelar-${id}`).onclick = async (e) => {
                    const btn = e.target;
                    if(confirm(`¿Deseas cancelar la visita de ${data.nombre}?`)) {
                        try {
                            btn.disabled = true;
                            btn.innerText = "⏳...";

                            const docRef = doc(db, "visitas", id);
                            await updateDoc(docRef, { 
                                estado: "cancelado" 
                            });

                            await addDoc(collection(db, "historial_accesos"), {
                                nombre: data.nombre,
                                casa: data.casa,
                                resultado: "DENEGADO",
                                motivo: "Cancelado por Caseta",
                                timestamp: Date.now(),
                                guardia: localStorage.getItem("usuario") || "Caseta"
                            });

                        } catch (error) {
                            console.error("Error al cancelar:", error);
                            alert("Error al cancelar.");
                            btn.disabled = false;
                            btn.innerText = "Cancelar";
                        }
                    }
                };
            });
            contador.innerText = total;
        }, (error) => {
            console.error(error);
            if(error.message.includes("index")) {
                contenedor.innerHTML = `<div class="vacio">⚠️ Error de Índice: Debes crear el índice en Firebase para ordenar por tiempo.</div>`;
            }
        });
    </script>
</body>
</html>
