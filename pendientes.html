<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Visitas Pendientes</title>

<!-- ESTILOS -->
<style>
body {
    margin: 0;
    font-family: 'Segoe UI', Arial;
    background: #f1f5f9;
}

header {
    background: #0f172a;
    color: white;
    padding: 18px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
}

.subheader {
    text-align: center;
    padding: 10px;
    color: #64748b;
}

#lista {
    padding: 15px;
}

.card {
    background: white;
    margin-bottom: 15px;
    padding: 18px;
    border-radius: 12px;
    box-shadow: 0px 3px 10px rgba(0,0,0,0.15);
    transition: 0.2s;
}

.card:hover {
    transform: scale(1.01);
}

.nombre {
    font-size: 18px;
    font-weight: bold;
    color: #0f172a;
}

.info {
    margin-top: 6px;
    font-size: 14px;
    color: #334155;
}

.estado {
    margin-top: 10px;
    font-weight: bold;
    color: orange;
}

.badge {
    display: inline-block;
    padding: 5px 10px;
    background: orange;
    color: white;
    border-radius: 8px;
    font-size: 12px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    padding: 10px;
}

.btn {
    background: #1e293b;
    color: white;
    padding: 8px 14px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
}

.vacio {
    text-align: center;
    margin-top: 40px;
    color: #64748b;
    font-size: 16px;
}
</style>

<!-- FIREBASE -->
<script type="module">
import { db } from "./firebase.js";
import {
    collection,
    query,
    orderBy,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// CONTENEDOR
let contenedor;

// INICIAR
window.addEventListener("DOMContentLoaded", () => {
    contenedor = document.getElementById("lista");
    cargarPendientes();
});

// FUNCIÓN PRINCIPAL
function cargarPendientes() {

    const q = query(
        collection(db, "visitas"),
        orderBy("timestamp", "desc") // 🔥 FIX REAL
    );

    onSnapshot(q, (snapshot) => {

        contenedor.innerHTML = "";

        if (snapshot.empty) {
            contenedor.innerHTML = `
                <div class="vacio">
                    🚫 No hay visitas registradas
                </div>
            `;
            return;
        }

        let hayPendientes = false;

        snapshot.forEach(doc => {

            const data = doc.data();

            // 🔥 SOLO MOSTRAR PENDIENTES
            if (data.estado === "pendiente") {

                hayPendientes = true;

                const card = document.createElement("div");
                card.className = "card";

                card.innerHTML = `
                    <div class="nombre">👤 ${data.nombre || "Sin nombre"}</div>

                    <div class="info">🏠 Casa: ${data.casa || "N/A"}</div>
                    <div class="info">📌 Tipo: ${data.tipo || "N/A"}</div>
                    <div class="info">📅 Fecha: ${data.fecha || "N/A"}</div>
                    <div class="info">👮 Autoriza: ${data.autoriza || "N/A"}</div>

                    <div class="estado">
                        <span class="badge">PENDIENTE</span>
                    </div>
                `;

                contenedor.appendChild(card);
            }

        });

        // 🔥 SI NO HAY PENDIENTES
        if (!hayPendientes) {
            contenedor.innerHTML = `
                <div class="vacio">
                    ✅ No hay visitas pendientes
                </div>
            `;
        }

    }, (error) => {
        console.error(error);
        contenedor.innerHTML = `
            <div class="vacio">
                ❌ Error cargando datos
            </div>
        `;
    });
}
</script>
</head>

<body>

<header>
    📋 VISITAS PENDIENTES
</header>

<div class="topbar">
    <a class="btn" href="index.html">⬅ Volver</a>
</div>

<div class="subheader">
    Monitoreo en tiempo real
</div>

<div id="lista"></div>

</body>
</html>
