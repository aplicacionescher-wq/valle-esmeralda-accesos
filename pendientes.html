<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel - Visitas Pendientes</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', Arial;
    background: #f1f5f9;
    display: flex;
}

/* SIDEBAR */
.sidebar {
    width: 220px;
    background: #0f172a;
    color: white;
    height: 100vh;
    padding: 20px;
    position: fixed;
}

.sidebar h2 {
    font-size: 18px;
    margin-bottom: 20px;
}

.sidebar a {
    display: block;
    color: #cbd5f5;
    text-decoration: none;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 10px;
    transition: 0.2s;
}

.sidebar a:hover {
    background: #1e293b;
    color: white;
}

/* CONTENIDO */
.main {
    margin-left: 240px;
    width: 100%;
}

/* HEADER */
.header {
    background: white;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
}

.title {
    font-size: 18px;
    font-weight: bold;
}

/* CONTADOR */
.stats {
    padding: 20px;
}

.card-stat {
    background: #1e293b;
    color: white;
    padding: 15px;
    border-radius: 12px;
    display: inline-block;
    margin-right: 10px;
}

/* LISTA */
#lista {
    padding: 20px;
}

.card {
    background: white;
    margin-bottom: 15px;
    padding: 18px;
    border-radius: 12px;
    box-shadow: 0px 3px 10px rgba(0,0,0,0.15);
}

.nombre {
    font-size: 18px;
    font-weight: bold;
}

.info {
    font-size: 14px;
    margin-top: 5px;
}

/* BOTONES */
.actions {
    margin-top: 10px;
}

.btn {
    padding: 6px 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-right: 5px;
}

.aprobar {
    background: #16a34a;
    color: white;
}

.rechazar {
    background: #dc2626;
    color: white;
}

/* VACIO */
.vacio {
    text-align: center;
    margin-top: 40px;
    color: #64748b;
}
</style>

<script type="module">
import { db } from "./firebase.js";
import {
    collection,
    query,
    orderBy,
    onSnapshot,
    updateDoc,
    doc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

let contenedor;
let contador;

window.addEventListener("DOMContentLoaded", () => {
    contenedor = document.getElementById("lista");
    contador = document.getElementById("contador");
    cargarPendientes();
});

function cargarPendientes() {

    const q = query(
        collection(db, "visitas"),
        orderBy("timestamp", "desc")
    );

    onSnapshot(q, (snapshot) => {

        contenedor.innerHTML = "";
        let total = 0;

        if (snapshot.empty) {
            contenedor.innerHTML = `<div class="vacio">🚫 Sin registros</div>`;
            contador.innerText = "0";
            return;
        }

        snapshot.forEach(docSnap => {

            const data = docSnap.data();

            if (data.estado === "pendiente") {

                total++;

                const card = document.createElement("div");
                card.className = "card";

                card.innerHTML = `
                    <div class="nombre">👤 ${data.nombre}</div>
                    <div class="info">🏠 Casa: ${data.casa}</div>
                    <div class="info">📅 Fecha: ${data.fecha}</div>
                    <div class="info">📌 Tipo: ${data.tipo}</div>
                    <div class="info">👮 Autoriza: ${data.autoriza}</div>

                    <div class="actions">
                        <button class="btn aprobar">Aprobar</button>
                        <button class="btn rechazar">Rechazar</button>
                    </div>
                `;

                // BOTONES FUNCIONALES 🔥
                card.querySelector(".aprobar").onclick = () => cambiarEstado(docSnap.id, "aprobado");
                card.querySelector(".rechazar").onclick = () => cambiarEstado(docSnap.id, "rechazado");

                contenedor.appendChild(card);
            }

        });

        contador.innerText = total;

        if (total === 0) {
            contenedor.innerHTML = `<div class="vacio">✅ No hay pendientes</div>`;
        }

    });
}

// CAMBIAR ESTADO 🔥
async function cambiarEstado(id, estado) {
    const ref = doc(db, "visitas", id);
    await updateDoc(ref, { estado });
}
</script>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>🏢 Valle Esmeralda</h2>

    <a href="index.html">🏠 Inicio</a>
    <a href="pendientes.html">📋 Pendientes</a>
    <a href="#">✅ Aprobadas</a>
    <a href="#">❌ Rechazadas</a>
</div>

<!-- MAIN -->
<div class="main">

    <!-- HEADER -->
    <div class="header">
        <div class="title">📋 Panel de Visitas</div>
        <div>👤 Admin</div>
    </div>

    <!-- STATS -->
    <div class="stats">
        <div class="card-stat">
            Pendientes: <span id="contador">0</span>
        </div>
    </div>

    <!-- LISTA -->
    <div id="lista"></div>

</div>

</body>
</html>
