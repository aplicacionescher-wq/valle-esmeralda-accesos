<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pase de Acceso</title>
    
    <script type="module" src="qrcode.min.js"></script>
    <script type="module" src="html2canvas.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; text-align: center; padding: 20px; }
        .card { background: #1e293b; padding: 25px; border-radius: 20px; max-width: 350px; margin: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #qr-inner { background: white; padding: 15px; display: inline-block; border-radius: 10px; margin: 20px 0; }
        .data { text-align: left; border-top: 1px solid #334155; padding-top: 15px; }
        .btn-save { background: #22c55e; color: white; border: none; width: 100%; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card" id="ticket">
        <h2 style="color:#22c55e; margin:0;">VALLE ESMERALDA</h2>
        <p style="font-size: 0.9rem; color: #94a3b8;">Pase de Invitado</p>
        
        <div id="qr-inner">
            <div id="qrcode"></div>
        </div>

        <div class="data">
            <p><b>Invitado:</b> <span id="txtNombre">Cargando...</span></p>
            <p><b>Casa:</b> <span id="txtCasa">...</span></p>
            <p><b>Tipo:</b> <span id="txtTipo">...</span></p>
        </div>
    </div>

    <button class="btn-save" onclick="guardarImagen()">💾 Guardar en Galería</button>

    <script type="module">
        import { db } from "./firebase.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        if (id) {
            async function cargarDatos() {
                try {
                    const snap = await getDoc(doc(db, "visitas", id));
                    if (snap.exists()) {
                        const d = snap.data();
                        document.getElementById("txtNombre").innerText = d.nombre;
                        document.getElementById("txtCasa").innerText = d.casa;
                        document.getElementById("txtTipo").innerText = d.tipo.toUpperCase();

                        // Generar el QR que leerá el guardia
                        if (typeof QRCode !== "undefined") {
                            new QRCode(document.getElementById("qrcode"), {
                                text: id,
                                width: 180,
                                height: 180
                            });
                        }
                    } else {
                        document.getElementById("txtNombre").innerText = "Pase Expirado/Inválido";
                    }
                } catch (e) {
                    console.error(e);
                }
            }
            cargarDatos();
        }

        window.guardarImagen = function() {
            if (typeof html2canvas !== "undefined") {
                html2canvas(document.querySelector("#ticket"), { backgroundColor: "#1e293b", scale: 2 }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = "Pase_Acceso.png";
                    link.href = canvas.toDataURL();
                    link.click();
                });
            } else {
                alert("La librería de imagen no cargó. Intenta refrescar.");
            }
        };
    </script>
</body>
</html>
