<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Acceso QR</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family: Arial;
text-align:center;
background:#0f172a;
color:white;
padding:20px;
}
.card{
background:#1e293b;
padding:20px;
border-radius:15px;
max-width:300px;
margin:auto;
}
</style>

</head>

<body>

<div class="card">
<h2>Acceso autorizado</h2>
<div id="info"></div>
</div>

<script>

try{

let params = new URLSearchParams(location.search)

let encoded = params.get("data")

let data = JSON.parse(atob(encoded))

let ahora = Date.now()

let expiracion = {
visita: 86400000,
proveedor: 43200000,
uber: 7200000,
paqueteria: 43200000
}

// ⏱️ VALIDAR
if (ahora - data.timestamp > expiracion[data.tipo]) {

document.body.innerHTML = "<h2>❌ QR EXPIRADO</h2>"

} else {

document.getElementById("info").innerHTML = `
<p><b>👤 Nombre:</b> ${data.nombre}</p>
<p><b>🏠 Casa:</b> ${data.casa}</p>
<p><b>🧑 Autoriza:</b> ${data.autoriza}</p>
<p><b>🚗 Tipo:</b> ${data.tipo}</p>
`

}

}catch(e){

document.body.innerHTML = "<h2>⚠️ QR inválido</h2>"

}

</script>

</body>

</html>
