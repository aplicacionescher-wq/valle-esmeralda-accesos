<script type="module">
    import { db } from "./firebase.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Extraer ID de la URL (?id=xxxx)
    const parametros = new URLSearchParams(window.location.search);
    const idCapturado = parametros.get("id");

    if (idCapturado) {
        // Buscamos en la colección "visitas" usando el ID
        const docRef = doc(db, "visitas", idCapturado);
        const documento = await getDoc(docRef);

        if (documento.exists()) {
            const datos = documento.data();
            document.getElementById("nombre-visitante").innerText = datos.nombre;
            document.getElementById("detalles").innerText = "Casa: " + datos.casa;
            
            // Generar un segundo QR interno para que el guardia lo escanee si es necesario
            new QRCode(document.getElementById("qr-interno"), { 
                text: idCapturado, // Solo el ID para que el scanner lo procese fácil
                width: 150, 
                height: 150 
            });
        } else {
            document.getElementById("nombre-visitante").innerText = "PASE NO ENCONTRADO";
        }
    }
</script>
