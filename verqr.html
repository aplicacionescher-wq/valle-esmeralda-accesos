<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Pase de Acceso</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; text-align: center; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 20px; max-width: 350px; margin: auto; }
        #area-descarga { background: #1e293b; padding: 15px; border-radius: 15px; }
        #qr-code { background: white; padding: 10px; display: inline-block; border-radius: 10px; margin: 15px 0; }
        .info { text-align: left; border-top: 1px solid #334155; padding-top: 15px; }
        .btn-download { background: #3b82f6; color: white; border: none; width: 100%; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 16px; }
    </style>
</head>
<body>

    <div class="card">
        <div id="area-descarga">
            <h2 style="color:#22c55e;">Pase de Acceso</h2>
            <div id="qr-code"></div>
            <div class="info">
                <p><b>Invitado:</b> <span id="nombre">Cargando...</span></p>
                <p><b>Casa:</b> <span id="casa">...</span></p>
                <p><b>Tipo:</b> <span id="tipo">...</span></p>
            </div>
        </div>

        <button class="btn-download" onclick="descargarPase()">💾 Guardar en Galería</button>
    </div>

    <script type="module">
        import { db } from "./firebase.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const id = new URLSearchParams(window.location.search).get("id");

        if (id) {
            const docSnap = await getDoc(doc(db, "visitas", id));
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById("nombre").innerText = data.nombre;
                document.getElementById("casa").innerText = data.casa;
                document.getElementById("tipo").innerText = data.tipo.toUpperCase();

                new QRCode(document.getElementById("qr-code"), {
                    text: id, // El guardia escanea el ID directamente
                    width: 180,
                    height: 180
                });
            }
        }

        window.descargarPase = function() {
            html2canvas(document.querySelector("#area-descarga"), {
                backgroundColor: "#1e293b",
                scale: 2,
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = "Pase_Valle.png";
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        };
    </script>
</body>
</html>
