<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valle Esmeralda - Acceso</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { margin: 0; font-family: 'Segoe UI', Arial; background: #0f172a; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-box { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 350px; text-align: center; }
        h2 { color: #0f172a; margin-bottom: 25px; font-size: 24px; }
        .input-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 12px; font-weight: bold; color: #64748b; margin-bottom: 5px; text-transform: uppercase; }
        input { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; font-size: 16px; transition: 0.3s; }
        input:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }
        button { width: 100%; padding: 14px; background: #0f172a; color: #38bdf8; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #1e293b; color: white; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🏢 Valle Esmeralda</h2>
        <div class="input-group">
            <label>Usuario</label>
            <input id="domicilio" type="text" placeholder="Ej: Calle 5 num 10">
        </div>
        <div class="input-group">
            <label>Contraseña</label>
            <input id="password" type="password" placeholder="••••••••">
        </div>
        <button id="loginBtn">Ingresar al Sistema</button>
    </div>

    <script type="module">
        import { db } from "./firebase.js";
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        async function login() {
            const usuario = document.getElementById("domicilio").value.trim();
            const password = document.getElementById("password").value.trim();
            const btn = document.getElementById("loginBtn");

            if (!usuario || !password) return alert("Por favor, completa todos los campos.");

            try {
                btn.disabled = true;
                btn.innerText = "Verificando...";

                const q = query(collection(db, "usuarios"), where("usuario", "==", usuario));
                const snap = await getDocs(q);

                if (snap.empty) {
                    alert("Usuario no registrado.");
                    resetBtn(btn);
                    return;
                }

                let userData = null;
                snap.forEach(doc => userData = doc.data());

                if (userData.password === password) {
                    localStorage.setItem("usuario", usuario);
                    localStorage.setItem("rol", userData.rol); // admin, caseta, residente
                    localStorage.setItem("casa", userData.casa || "S/N");

                    // REDIRECCIÓN INTELIGENTE
                    if (userData.rol === "admin") {
                        window.location.href = "admin.html";
                    } else if (userData.rol === "caseta") {
                        window.location.href = "pendientes.html";
                    } else {
                        window.location.href = "generar.html";
                    }
                } else {
                    alert("Contraseña incorrecta.");
                    resetBtn(btn);
                }
            } catch (e) {
                console.error(e);
                alert("Error de conexión con la base de datos.");
                resetBtn(btn);
            }
        }

        function resetBtn(btn) {
            btn.disabled = false;
            btn.innerText = "Ingresar al Sistema";
        }

        document.getElementById("loginBtn").onclick = login;

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./sw.js");
        }
    </script>
</body>
</html>
