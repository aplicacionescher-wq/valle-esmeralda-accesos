<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valle Esmeralda - Acceso</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #0f172a; display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; }
        .logo-container { margin-bottom: 25px; text-align: center; }
        .logo-container img { max-width: 250px; height: auto; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)); }
        .login-box { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); width: 90%; max-width: 340px; text-align: center; border-top: 6px solid #00a99d; }
        h2 { color: #1e293b; margin-bottom: 25px; font-size: 22px; font-weight: bold; }
        .input-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 11px; font-weight: bold; color: #64748b; margin-bottom: 5px; text-transform: uppercase; }
        input { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; font-size: 16px; transition: 0.3s; }
        input:focus { outline: none; border-color: #ec008c; box-shadow: 0 0 0 3px rgba(236, 0, 140, 0.1); }
        button { width: 100%; padding: 15px; background: #0f172a; color: #38bdf8; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #00a99d; color: white; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        #error-msg { color: #ef4444; font-size: 13px; margin-top: 15px; display: none; font-weight: 500; padding: 10px; background: #fee2e2; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="logo.png" alt="Valle Esmeralda Residencial">
    </div>

    <div class="login-box">
        <h2>Panel de Acceso</h2>
        
        <div class="input-group">
            <label>Usuario (Domicilio)</label>
            <input id="domicilioInput" type="text" placeholder="Ej: caseta" autocomplete="username">
        </div>
        
        <div class="input-group">
            <label>Contraseña</label>
            <input id="passwordInput" type="password" placeholder="••••" autocomplete="current-password">
        </div>
        
        <button id="loginBtn">Ingresar</button>
        <div id="error-msg"></div>
    </div>

    <script type="module">
        import { db } from "./firebase.js";
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const btn = document.getElementById("loginBtn");
        const errorBox = document.getElementById("error-msg");

        async function realizarLogin() {
            const userVal = document.getElementById("domicilioInput").value.trim();
            const passVal = document.getElementById("passwordInput").value.trim();

            errorBox.style.display = "none";

            if (!userVal || !passVal) {
                mostrarError("Ingresa usuario y contraseña");
                return;
            }

            try {
                btn.disabled = true;
                btn.innerText = "Verificando...";

                // Consulta basada exactamente en tus campos: domicilio, password, rol
                const q = query(collection(db, "usuarios"), where("domicilio", "==", userVal));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    mostrarError("El usuario no existe");
                    resetBtn();
                    return;
                }

                let userData = null;
                querySnapshot.forEach((doc) => {
                    userData = doc.data();
                });

                // Validación de contraseña como texto
                if (String(userData.password) === String(passVal)) {
                    
                    localStorage.setItem("usuario", userVal);
                    localStorage.setItem("rol", userData.rol);
                    localStorage.setItem("casa", userData.domicilio);

                    // Redirección por rol
                    if (userData.rol === "admin") {
                        window.location.href = "admin.html";
                    } else if (userData.rol === "caseta") {
                        window.location.href = "pendientes.html";
                    } else {
                        window.location.href = "generar.html";
                    }
                } else {
                    mostrarError("Contraseña incorrecta");
                    resetBtn();
                }

            } catch (error) {
                console.error(error);
                mostrarError("Error de conexión con la base de datos");
                resetBtn();
            }
        }

        function mostrarError(txt) {
            errorBox.innerText = txt;
            errorBox.style.display = "block";
        }

        function resetBtn() {
            btn.disabled = false;
            btn.innerText = "Ingresar";
        }

        btn.onclick = realizarLogin;

        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') realizarLogin();
        });
    </script>
</body>
</html>
