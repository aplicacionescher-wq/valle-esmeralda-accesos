<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Valle Esmeralda Residencial</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #00a99d;
            --error: #ef4444;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #334155;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo { margin-bottom: 25px; }
        .logo img { max-width: 180px; height: auto; }

        h2 {
            margin-bottom: 25px;
            color: var(--primary);
            font-size: 24px;
            font-weight: 700;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 6px;
            margin-left: 4px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.3s ease;
            background: #f8fafc;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 169, 157, 0.1);
        }

        .btn-ingresar {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: #38bdf8;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-ingresar:hover {
            background: var(--accent);
            color: white;
            transform: translateY(-1px);
        }

        .btn-ingresar:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        #error-msg {
            color: var(--error);
            font-size: 14px;
            margin-top: 20px;
            display: none;
            background: #fee2e2;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #fecaca;
        }

        .footer {
            margin-top: 30px;
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">
            <img src="logo.png" alt="Valle Esmeralda Logo">
        </div>
        
        <h2>Iniciar Sesión</h2>
        
        <div class="input-group">
            <label>Usuario / Domicilio</label>
            <input type="text" id="userEmail" placeholder="Ej: Valle de Onix 1" autocomplete="username">
        </div>
        
        <div class="input-group">
            <label>Contraseña</label>
            <input type="password" id="userPass" placeholder="••••••••" autocomplete="current-password">
        </div>
        
        <button class="btn-ingresar" id="btnLogin">Entrar al Sistema</button>
        
        <div id="error-msg"></div>
        
        <div class="footer">
            SISTEMA DE CONTROL RESIDENCIAL &copy; 2026
        </div>
    </div>

    <script type="module">
        import { db } from "./firebase.js";
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Limpiar sesiones antiguas al cargar
        localStorage.clear();

        const btnLogin = document.getElementById("btnLogin");
        const errorMsg = document.getElementById("error-msg");

        btnLogin.onclick = async () => {
            const userVal = document.getElementById("userEmail").value.trim();
            const passVal = document.getElementById("userPass").value.trim();

            if (!userVal || !passVal) {
                mostrarError("Por favor, ingresa tus credenciales.");
                return;
            }

            try {
                btnLogin.innerText = "Verificando...";
                btnLogin.disabled = true;

                // Consulta a la colección 'usuarios' filtrando por 'domicilio'
                const q = query(collection(db, "usuarios"), where("domicilio", "==", userVal));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    mostrarError("El usuario no existe en el sistema.");
                    resetBtn();
                    return;
                }

                const userData = querySnapshot.docs[0].data();

                // Verificar si la cuenta está activa
                if (userData.activo === false) {
                    mostrarError("Acceso denegado. Esta cuenta está bloqueada.");
                    resetBtn();
                    return;
                }

                // Validar contraseña (sensible a mayúsculas)
                if (userData.password === passVal) {
                    
                    // --- PERSISTENCIA DE SESIÓN ---
                    localStorage.setItem("sesionActiva", "true");
                    localStorage.setItem("usuario", userData.domicilio); // Usado para mostrar "Casa: X"
                    localStorage.setItem("rol", userData.rol.toLowerCase());

                    const rol = userData.rol.toLowerCase();
                    
                    // --- REDIRECCIÓN POR ROL ---
                    if (rol === "admin") {
                        window.location.replace("admin.html");
                    } else if (rol === "caseta") {
                        window.location.replace("pendientes.html");
                    } else if (rol === "residente") {
                        window.location.replace("dashboard.html");
                    } else {
                        mostrarError("Rol de usuario no configurado.");
                        resetBtn();
                    }

                } else {
                    mostrarError("La contraseña es incorrecta.");
                    resetBtn();
                }

            } catch (error) {
                console.error("Error en Login:", error);
                mostrarError("Error de conexión con la base de datos.");
                resetBtn();
            }
        };

        function mostrarError(txt) {
            errorMsg.innerText = txt;
            errorMsg.style.display = "block";
            setTimeout(() => { errorMsg.style.display = "none"; }, 5000);
        }

        function resetBtn() {
            btnLogin.innerText = "Entrar al Sistema";
            btnLogin.disabled = false;
        }

        // Detectar tecla Enter
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') btnLogin.click();
        });
    </script>
</body>
</html>
