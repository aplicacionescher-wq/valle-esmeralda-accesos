<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caseta - Control de Acceso</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: white; text-align: center; margin: 0; padding: 20px; }
        h2 { color: #22c55e; margin-bottom: 20px; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 12px; overflow: hidden; border: 2px solid #334155; }
        .card { background: #1e293b; padding: 20px; border-radius: 15px; max-width: 400px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .info-result { font-size: 1.1em; margin: 15px 0; min-height: 50px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        input[type="file"] { margin: 15px 0; width: 100%; color: #94a3b8; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; font-size: 16px; }
        .btn-scan { background: #22c55e; color: white; }
        .btn-save { background: #3b82f6; color: white; }
        .btn-logout { background: #ef4444; color: white; margin-top: 30px; }
        img#foto-visitante { width: 150px; border-radius: 10px; margin-top: 10px; border: 2px solid #475569; }
    </style>
</head>
<body>

    <h2>Panel de Caseta</h2>
    
    <div id="reader"></div>
    <p id="mensaje">Presiona el botón para escanear</p>
    <button class="btn-scan" onclick="activarCamara()">📷 Iniciar Escáner</button>

    <div class="card">
        <div id="resultado" class="info-result">Esperando código QR...</div>
        <div id="contenedor-foto"></div>
        
        <p style="margin-top: 20px; font-weight: bold;">Evidencia de Entrada:</p>
        <input type="file" id="fotoCaseta" accept="image/*" capture="camera">
        
        <button class="btn-save" onclick="guardarFoto()">✅ Registrar Ingreso</button>
    </div>

    <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script type="module" src="scanner.js"></script>

    <script>
        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
