<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caseta - Escáner</title>
    <style>
        body { font-family: Arial; text-align: center; background: #0f172a; color: white; padding: 15px; }
        #reader { width: 100%; max-width: 400px; margin: auto; border-radius: 10px; overflow: hidden; }
        .card { background: #1e293b; padding: 15px; border-radius: 12px; margin-top: 15px; }
        button { width: 100%; padding: 15px; background: #22c55e; color: white; border: none; border-radius: 8px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>Control Caseta</h2>
    <div id="reader"></div>
    <button onclick="activarCamara()">Iniciar Escáner</button>
    <div class="card" id="resultado">Esperando código...</div>
    <div class="card">
        <p>Evidencia (Foto):</p>
        <input type="file" id="fotoCaseta" accept="image/*" capture="camera">
        <button style="background: #3b82f6;" onclick="guardarFoto()">Registrar Entrada</button>
    </div>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script type="module" src="scanner.js"></script>
</body>
</html>
