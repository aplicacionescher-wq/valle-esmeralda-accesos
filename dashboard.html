<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel Residente</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 20px; background: #f4f4f4; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 350px; margin: auto; }
        button { width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn-reg { background: #2e7d32; color: white; }
        .btn-out { background: #dc3545; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Panel Residente</h2>
        <p id="casa-txt" style="font-weight: bold; color: #555;"></p>
        <button class="btn-reg" onclick="location.href='generar.html'">Registrar Visita</button>
        <button class="btn-out" onclick="logout()">Cerrar Sesión</button>
    </div>
    <script>
        if (localStorage.getItem("rol") !== "residente") window.location.href = "index.html";
        document.getElementById("casa-txt").innerText = "Casa: " + localStorage.getItem("casa");
        function logout() { localStorage.clear(); window.location.href = "index.html"; }
    </script>
</body>
</html>
