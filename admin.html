<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin General - Valle Esmeralda</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Arial; background: #f1f5f9; display: flex; }
        .sidebar { width: 220px; background: #0f172a; color: white; height: 100vh; padding: 20px; position: fixed; }
        .sidebar h2 { font-size: 18px; margin-bottom: 20px; color: #38bdf8; }
        .sidebar a { display: block; color: #cbd5f5; text-decoration: none; padding: 12px; border-radius: 8px; margin-bottom: 10px; transition: 0.3s; }
        .sidebar a:hover { background: #1e293b; color: white; }
        
        .main { margin-left: 240px; width: calc(100% - 240px); padding: 20px; }
        .header-panel { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        .filtros { display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap; margin-top: 15px; }
        .campo { display: flex; flex-direction: column; gap: 5px; }
        .campo label { font-size: 12px; font-weight: bold; color: #475569; }
        .campo input { padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; }
        
        .btn-buscar { background: #0f172a; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-buscar:hover { background: #1e293b; }

        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        th { background: #0f172a; color: white; padding: 15px; text-align: left; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; color: #334155; }
        .status { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .pendiente { background: #fef9c3; color: #854d0e; }
        .usado { background: #dcfce7; color: #166534; }
        .cancelado { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>🏢 Valle Esmeralda</h2>
        <a href="escaner.html">🏠 Inicio (Escáner)</a>
        <a href="pendientes.html">📋 Ver Pendientes</a>
        <a href="admin.html" style="background: #1e293b; color: #38bdf8;">📊 Admin General</a>
    </div>

    <div class="main">
        <div class="header-panel">
            <h2 style="margin:0; color:#0f172a;">📊 Historial General de Accesos</h2>
            
            <div class="filtros">
                <div class="campo">
                    <label>Desde:</label>
                    <input type="date" id="fechaInicio">
                </div>
                <div class="campo">
                    <label>Hasta:</label>
                    <input type="date" id="fechaFin">
                </div>
                <button class="btn-buscar" id="btnFiltrar">🔍 Filtrar por Fecha</button>
                <button class="btn-buscar" style="background:#64748b;" id="btnLimpiar">🧹 Ver Todo</button>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Fecha y Hora</th>
                    <th>Invitado</th>
                    <th>Casa</th>
                    <th>Tipo</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="tabla-cuerpo">
                </tbody>
        </table>
    </div>

    <script type="module">
        import { db } from "./firebase.js";
        import { collection, query, onSnapshot, orderBy, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- SEGURIDAD ---
        const usuarioActivo = localStorage.getItem("usuario");
        const rolActivo = localStorage.getItem("rol");

        if (rolActivo !== "admin") {
            alert("Acceso denegado. Se requiere perfil de Administrador.");
            window.location.href = "escaner.html"; 
        }

        const tablaCuerpo = document.getElementById("tabla-cuerpo");

        // Función para renderizar filas
        function renderizarFilas(snapshot) {
            tablaCuerpo.innerHTML = "";
            if (snapshot.empty) {
                tablaCuerpo.innerHTML = '<tr><td colspan="5" style="text-align:center;">No se encontraron registros</td></tr>';
                return;
            }
            snapshot.forEach(docSnap => {
                const d = docSnap.data();
                const fecha = d.timestamp ? new Date(d.timestamp).toLocaleString() : "S/F";
                const estadoClass = d.estado || "pendiente";
                
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${fecha}</td>
                    <td><b>${d.nombre}</b></td>
                    <td>Casa ${d.casa}</td>
                    <td>${d.tipo}</td>
                    <td><span class="status ${estadoClass}">${estadoClass}</span></td>
                `;
                tablaCuerpo.appendChild(tr);
            });
        }

        // Carga inicial (Todos los registros en tiempo real)
        const qInicial = query(collection(db, "visitas"), orderBy("timestamp", "desc"));
        let unsubscribe = onSnapshot(qInicial, renderizarFilas);

        // --- BUSQUEDA POR FECHAS ---
        document.getElementById("btnFiltrar").onclick = async () => {
            const fInicio = document.getElementById("fechaInicio").value;
            const fFin = document.getElementById("fechaFin").value;

            if (!fInicio || !fFin) {
                alert("Selecciona ambas fechas para buscar.");
                return;
            }

            // Desactivar tiempo real para la búsqueda filtrada
            unsubscribe();

            const msInicio = new Date(fInicio + "T00:00:00").getTime();
            const msFin = new Date(fFin + "T23:59:59").getTime();

            const qFiltrada = query(
                collection(db, "visitas"),
                where("timestamp", ">=", msInicio),
                where("timestamp", "<=", msFin),
                orderBy("timestamp", "desc")
            );

            try {
                const querySnapshot = await getDocs(qFiltrada);
                renderizarFilas(querySnapshot);
            } catch (error) {
                console.error("Error al filtrar:", error);
                if (error.message.includes("index")) {
                    alert("Se requiere crear un índice en Firebase. Revisa la consola F12.");
                }
            }
        };

        // Limpiar filtros
        document.getElementById("btnLimpiar").onclick = () => {
            document.getElementById("fechaInicio").value = "";
            document.getElementById("fechaFin").value = "";
            unsubscribe = onSnapshot(qInicial, renderizarFilas);
        };
    </script>
</body>
</html>
