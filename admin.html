<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo - Valle Esmeralda</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* DISEÑO ORIGINAL VALLE ESMERALDA */
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0f172a; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
            color: white;
        }

        .header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header img { 
            max-width: 200px; 
            height: auto; 
        }

        .admin-card { 
            background: white; 
            padding: 35px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            width: 95%; 
            max-width: 480px; 
            text-align: center; 
            border-top: 6px solid #00a99d; 
            margin-bottom: 25px;
            color: #1e293b;
        }

        h2 { 
            color: #0f172a; 
            margin-top: 0; 
            font-size: 24px; 
            font-weight: bold;
            margin-bottom: 25px;
        }
        
        .input-group { 
            text-align: left; 
            margin-bottom: 15px; 
        }
        
        label { 
            display: block; 
            font-size: 11px; 
            font-weight: bold; 
            color: #64748b; 
            margin-bottom: 5px; 
            text-transform: uppercase; 
            letter-spacing: 1px;
        }
        
        input, select { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #e2e8f0; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 16px; 
            background: #f8fafc;
            color: #0f172a;
        }

        input:focus {
            outline: none;
            border-color: #00a99d;
            box-shadow: 0 0 0 3px rgba(0, 169, 157, 0.1);
        }

        .btn-primary { 
            width: 100%; 
            padding: 15px; 
            background: #0f172a; 
            color: #38bdf8; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px; 
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-primary:hover { 
            background: #00a99d; 
            color: white; 
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-bulk {
            width: 100%; 
            padding: 15px; 
            background: transparent; 
            color: #ec008c; 
            border: 2px solid #ec008c; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px; 
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-bulk:hover {
            background: #ec008c;
            color: white;
        }

        #status {
            margin-top: 20px;
            font-size: 14px;
            font-weight: 600;
            display: none;
            padding: 12px;
            border-radius: 8px;
        }

        .logout-btn {
            background: transparent; 
            border: 1px solid #38bdf8; 
            color: #38bdf8; 
            padding: 10px 20px; 
            border-radius: 8px; 
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .logout-btn:hover {
            background: rgba(56, 189, 248, 0.1);
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" alt="Valle Esmeralda">
        <button class="logout-btn" onclick="window.location.href='index.html'">Cerrar Sesión</button>
    </div>

    <div class="admin-card">
        <h2>Registro de Usuarios</h2>
        
        <div class="input-group">
            <label>Domicilio / Usuario</label>
            <input id="newDom" type="text" placeholder="Ej: Valle de Onix 15">
        </div>

        <div class="input-group">
            <label>Contraseña Sugerida</label>
            <input id="newPass" type="text" value="1234">
        </div>

        <div class="input-group">
            <label>Tipo de Permiso (Rol)</label>
            <select id="newRol">
                <option value="residente">Residente</option>
                <option value="caseta">Caseta / Guardia</option>
                <option value="admin">Administrador</option>
            </select>
        </div>

        <button id="saveBtn" class="btn-primary">Guardar en Base de Datos</button>
        <div id="status"></div>
    </div>

    <div class="admin-card" style="border-top-color: #ec008c;">
        <h2>Acciones Masivas</h2>
        <p style="font-size: 13px; color: #64748b; margin-bottom: 20px; line-height: 1.5;">
            Al presionar este botón, se generarán automáticamente 100 usuarios (del 1 al 100) para cada calle del residencial.
        </p>
        <button id="bulkBtn" class="btn-bulk">
            Generar Usuarios de Calles
        </button>
    </div>

    <script type="module">
        // Importación de configuración y métodos de Firebase
        import { db } from "./firebase.js";
        import { 
            collection, 
            addDoc, 
            query, 
            where, 
            getDocs 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const saveBtn = document.getElementById("saveBtn");
        const bulkBtn = document.getElementById("bulkBtn");
        const statusMsg = document.getElementById("status");

        // LÓGICA DE REGISTRO INDIVIDUAL
        saveBtn.onclick = async () => {
            const domicilio = document.getElementById("newDom").value.trim();
            const password = document.getElementById("newPass").value.trim();
            const rol = document.getElementById("newRol").value;

            if (!domicilio || !password) {
                mostrarStatus("Por favor llena todos los campos.", "red");
                return;
            }

            try {
                saveBtn.disabled = true;
                saveBtn.innerText = "Verificando...";

                // Validar si el usuario ya existe para evitar duplicados
                const q = query(collection(db, "usuarios"), where("domicilio", "==", domicilio));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    mostrarStatus("Este usuario ya existe en el sistema.", "red");
                    saveBtn.disabled = false;
                    saveBtn.innerText = "Guardar en Base de Datos";
                    return;
                }

                // Guardar en la colección 'usuarios'
                await addDoc(collection(db, "usuarios"), {
                    domicilio: domicilio,
                    password: password,
                    rol: rol
                });

                mostrarStatus("¡Usuario registrado con éxito!", "green");
                document.getElementById("newDom").value = "";
                
            } catch (error) {
                console.error("Error al guardar:", error);
                mostrarStatus("Error de conexión con Firebase.", "red");
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerText = "Guardar en Base de Datos";
            }
        };

        // LÓGICA DE GENERACIÓN MASIVA DE CALLES
        bulkBtn.onclick = async () => {
            const confirmacion = confirm("¿Estás seguro de generar usuarios masivos? Esto añadirá 700 registros a la base de datos.");
            if (!confirmacion) return;

            const calles = [
                "Valle Turquesa Norte",
                "Valle Turquesa Sur",
                "Valle Turquesa Oriente",
                "Valle Turquesa Poniente",
                "Valle de la Perla",
                "Valle de Onix",
                "Valle de Opalo"
            ];

            try {
                bulkBtn.disabled = true;
                bulkBtn.innerText = "Generando... No cierres esta ventana";

                // Ciclo por cada calle definida
                for (let calle of calles) {
                    // Ciclo para generar 100 números de casa por calle
                    for (let i = 1; i <= 100; i++) {
                        let domicilioGenerado = calle + " " + i;
                        
                        // Guardar cada registro individualmente
                        await addDoc(collection(db, "usuarios"), {
                            domicilio: domicilioGenerado,
                            password: "1234",
                            rol: "residente"
                        });
                    }
                    console.log("Completada: " + calle);
                }

                alert("¡Proceso terminado! Se han generado todos los usuarios de las calles.");
                bulkBtn.innerText = "Generación Terminada";
                
            } catch (error) {
                console.error("Error masivo:", error);
                alert("Hubo un error en la conexión. Algunos usuarios podrían no haberse creado.");
                bulkBtn.disabled = false;
                bulkBtn.innerText = "Reintentar Generación";
            }
        };

        // Función para mostrar alertas visuales en el panel
        function mostrarStatus(texto, color) {
            statusMsg.innerText = texto;
            statusMsg.style.display = "block";
            
            if (color === "red") {
                statusMsg.style.color = "#ef4444";
                statusMsg.style.background = "#fee2e2";
            } else {
                statusMsg.style.color = "#10b981";
                statusMsg.style.background = "#dcfce7";
            }

            setTimeout(() => {
                statusMsg.style.display = "none";
            }, 4000);
        }
    </script>
</body>
</html>
