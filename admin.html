<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin General - Valle Esmeralda Residencial</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #f1f5f9; display: flex; }
        
        /* BARRA LATERAL CON LOGO */
        .sidebar { width: 220px; background: #1e293b; color: white; height: 100vh; padding: 20px; position: fixed; display: flex; flex-direction: column; align-items: center; border-right: 1px solid #334155; box-sizing: border-box; }
        
        .sidebar-logo { margin-bottom: 30px; text-align: center; border-bottom: 1px solid #334155; padding-bottom: 20px; width: 100%; }
        .sidebar-logo img { max-width: 150px; height: auto; }
        
        .sidebar-links { width: 100%; }
        .sidebar a { display: block; color: #cbd5f5; text-decoration: none; padding: 12px; border-radius: 8px; margin-bottom: 10px; transition: 0.3s; font-size: 14px; cursor: pointer; }
        .sidebar a:hover { background: #334155; color: #38bdf8; }
        .sidebar a.active { background: #0f172a; color: #00a99d; font-weight: bold; }
        
        .main { margin-left: 220px; width: calc(100% - 220px); padding: 20px; box-sizing: border-box; }
        
        /* CARDS DE CONTROL */
        .filter-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 25px; border-top: 4px solid #00a99d; }
        .grid-filtros { display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap; }
        .campo { display: flex; flex-direction: column; gap: 5px; }
        .campo label { font-size: 11px; font-weight: bold; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
        .campo input, .campo select { padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 14px; transition: 0.3s; min-width: 180px; }
        .campo input:focus { border-color: #00a99d; outline: none; box-shadow: 0 0 0 3px rgba(0, 169, 157, 0.1); }
        
        /* BOTONES */
        .btn-accion { background: #0f172a; color: #38bdf8; border: none; padding: 11px 22px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 13px; text-transform: uppercase; }
        .btn-accion:hover { background: #00a99d; color: white; }
        .btn-secundario { background: #f1f5f9; color: #475569; }
        .btn-secundario:hover { background: #e2e8f0; color: #0f172a; }

        /* TABLA ESTANDARIZADA */
        .tabla-contenedor { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #0f172a; color: white; padding: 15px; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 14px; color: #334155; }
        
        /* ESTADOS */
        .status { padding: 5px 10px; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .usado { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .pendiente { background: #fef9c3; color: #854d0e; border: 1px solid #fef08a; }
        .cancelado { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .expirado { background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }

        #msg-status { margin-top: 10px; font-size: 13px; font-weight: bold; display: none; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo">
            <img src="logo.png" alt="Logo Valle Esmeralda">
        </div>
        <div class="sidebar-links">
            <a href="pendientes.html">📋 Ver Pendientes</a>
            <a href="admin.html" class="active">📊 Admin General</a>
            <a onclick="cerrarSesion()" style="color:#ec008c; cursor:pointer; margin-top:30px; display:block; padding:12px; font-weight:bold;">🚪 Cerrar Sesión</a>
        </div>
    </div>

    <div class="main">
        <div class="filter-card" style="border-top-color: #38bdf8;">
            <h2 style="margin: 0 0 20px 0; color: #0f172a;">👥 Alta de Usuarios</h2>
            <div class="grid-filtros">
                <div class="campo">
                    <label>Domicilio / Usuario</label>
                    <input type="text" id="userDom" placeholder="Ej: Valle de Onix 1">
                </div>
                <div class="campo">
                    <label>Contraseña</label>
                    <input type="text" id="userPass" placeholder="Contraseña">
                </div>
                <div class="campo">
                    <label>Rol</label>
                    <select id="userRol">
                        <option value="residente">Residente</option>
                        <option value="caseta">Caseta</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <button class="btn-accion" id="btnCrearUser">💾 Guardar Usuario</button>
            </div>
            <div id="msg-status"></div>
        </div>

        <div class="filter-card">
            <h2 style="margin: 0 0 20px 0; color: #0f172a;">📊 Historial Maestro de Accesos</h2>
            <div class="grid-filtros">
                <div class="campo">
                    <label>Desde</label>
                    <input type="date" id="fechaInicio">
                </div>
                <div class="campo">
                    <label>Hasta</label>
                    <input type="date" id="fechaFin">
                </div>
                <button class="btn-accion" id="btnFiltrar">🔍 Buscar</button>
                <button class="btn-accion btn-secundario" id="btnLimpiar">🧹 Limpiar Filtros</button>
            </div>
        </div>

        <div class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>Fecha y Hora</th>
                        <th>Nombre del Invitado</th>
                        <th>Casa</th>
                        <th>Tipo</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="tabla-cuerpo">
                    <tr><td colspan="5" style="text-align:center; padding:30px; color:#94a3b8;">Cargando historial...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { db } from "./firebase.js";
        import { collection, query, onSnapshot, orderBy, where, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- PROTECCIÓN DE RUTA ---
        if (localStorage.getItem("rol") !== "admin") {
            window.location.href = "index.html";
        }

        window.cerrarSesion = () => {
            localStorage.clear();
            window.location.href = "index.html";
        };

        const tablaCuerpo = document.getElementById("tabla-cuerpo");
        const statusDiv = document.getElementById("msg-status");
        let unsubscribe;

        // --- FUNCIÓN PARA DIBUJAR LA TABLA ---
        function renderizarTabla(snapshot) {
            tablaCuerpo.innerHTML = "";
            if (snapshot.empty) {
                tablaCuerpo.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:30px; color:#94a3b8;">No se encontraron registros.</td></tr>';
                return;
            }

            snapshot.forEach(docSnap => {
                const d = docSnap.data();
                const fecha = d.timestamp ? new Date(d.timestamp).toLocaleString() : "---";
                const estadoClass = d.estado || "pendiente";
                
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${fecha}</td>
                    <td><b>${d.nombre}</b></td>
                    <td>${d.casa}</td>
                    <td>${d.tipo || 'Visita'}</td>
                    <td><span class="status ${estadoClass}">${estadoClass}</span></td>
                `;
                tablaCuerpo.appendChild(tr);
            });
        }

        // --- CARGA INICIAL (TIEMPO REAL) ---
        const qInicial = query(collection(db, "visitas"), orderBy("timestamp", "desc"));
        unsubscribe = onSnapshot(qInicial, renderizarTabla);

        // --- FILTRADO POR FECHAS ---
        document.getElementById("btnFiltrar").onclick = async () => {
            const f1 = document.getElementById("fechaInicio").value;
            const f2 = document.getElementById("fechaFin").value;
            if (!f1 || !f2) return alert("Selecciona ambas fechas.");
            
            unsubscribe();
            const inicioMs = new Date(f1 + "T00:00:00").getTime();
            const finMs = new Date(f2 + "T23:59:59").getTime();

            const qFiltrada = query(
                collection(db, "visitas"),
                where("timestamp", ">=", inicioMs),
                where("timestamp", "<=", finMs),
                orderBy("timestamp", "desc")
            );

            try {
                const snap = await getDocs(qFiltrada);
                renderizarTabla(snap);
            } catch (error) {
                console.error(error);
            }
        };

        document.getElementById("btnLimpiar").onclick = () => {
            document.getElementById("fechaInicio").value = "";
            document.getElementById("fechaFin").value = "";
            unsubscribe = onSnapshot(qInicial, renderizarTabla);
        };

        // --- ALTA DE USUARIO (CORREGIDO) ---
        document.getElementById("btnCrearUser").onclick = async () => {
            const dom = document.getElementById("userDom").value.trim();
            const pass = document.getElementById("userPass").value.trim();
            const rol = document.getElementById("userRol").value;

            if(!dom || !pass) {
                alert("Por favor ingresa domicilio y contraseña.");
                return;
            }

            try {
                // Referencia limpia a la colección 'usuarios'
                const usuariosRef = collection(db, "usuarios");
                
                await addDoc(usuariosRef, {
                    domicilio: dom,
                    password: pass,
                    rol: rol
                });

                mostrarStatus("¡Usuario guardado correctamente!", "#10b981");
                
                // Limpiar campos
                document.getElementById("userDom").value = "";
                document.getElementById("userPass").value = "";
                
            } catch (e) {
                console.error("Error al guardar:", e);
                mostrarStatus("Error al guardar en Firebase", "#ef4444");
            }
        };

        function mostrarStatus(txt, color) {
            statusDiv.innerText = txt;
            statusDiv.style.color = color;
            statusDiv.style.display = "block";
            setTimeout(() => { statusDiv.style.display = "none"; }, 4000);
        }
    </script>
</body>
</html>
