<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Panel Administrador</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f4f4;
}

header{
background:#2e7d32;
color:white;
padding:15px;
text-align:center;
}

.logo{
width:80px;
margin-bottom:10px;
}

.container{
padding:20px;
}

.card{
background:white;
padding:20px;
margin:10px auto;
border-radius:10px;
max-width:400px;
box-shadow:0 2px 5px rgba(0,0,0,0.2);
text-align:center;
}

button{
width:100%;
padding:15px;
margin-top:10px;
border:none;
border-radius:8px;
background:#2e7d32;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1b5e20;
}

.footer{
text-align:center;
padding:15px;
font-size:12px;
color:#777;
}

</style>

</head>

<body>

<header>

<img src="logo.png" class="logo">

<h2>Valle Esmeralda</h2>

<p>Panel Administrador</p>

</header>

<div class="container">

<div class="card">

<h3>Accesos</h3>

<button onclick="ir('generar.html')">Registrar visita</button>

<button onclick="ir('scanner.html')">Escanear QR</button>

</div>

<div class="card">

<h3>Control</h3>

<button onclick="ir('historial.html')">Ver historial</button>

<button onclick="ir('usuarios.html')">Usuarios</button>

</div>

<div class="card">

<h3>Sistema</h3>

<button onclick="alert('Sistema activo correctamente')">Estado</button>

<button onclick="cerrarSesion()">Cerrar sesión</button>

</div>

</div>

<div class="footer">

Sistema de Accesos © Valle Esmeralda

</div>

<script>

function ir(pagina){
window.location.href=pagina
}

function cerrarSesion(){

localStorage.clear()

alert("Sesión cerrada")

window.location.href="index.html"

}

</script>

</body>

</html>
