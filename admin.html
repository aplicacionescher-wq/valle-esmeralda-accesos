<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración</title>
    <style>
        body { font-family: sans-serif; background: #f1f5f9; margin: 0; padding: 20px; }
        .stats { display: flex; gap: 10px; margin-bottom: 20px; }
        .stat-box { background: white; padding: 20px; border-radius: 10px; flex: 1; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; background: white; border-collapse: collapse; border-radius: 10px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #0f172a; color: white; }
        .status { padding: 5px 10px; border-radius: 5px; font-size: 12px; font-weight: bold; }
        .pendiente { background: #fef9c3; color: #a16207; }
        .usado { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>
    <h2>📊 Administración de Accesos</h2>
    
    <div id="lista-general">
        <table>
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Nombre</th>
                    <th>Casa</th>
                    <th>Tipo</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="tabla-body"></tbody>
        </table>
    </div>

    <script type="module">
        import { db } from "./firebase.js";
        import { collection, query, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const tbody = document.getElementById("tabla-body");

        const q = query(collection(db, "visitas"), orderBy("timestamp", "desc"));

        onSnapshot(q, (snapshot) => {
            tbody.innerHTML = "";
            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                const fecha = new Date(data.timestamp).toLocaleString();
                const fila = document.createElement("tr");
                fila.innerHTML = `
                    <td>${fecha}</td>
                    <td>${data.nombre}</td>
                    <td>${data.casa}</td>
                    <td>${data.tipo}</td>
                    <td><span class="status ${data.estado || 'pendiente'}">${data.estado || 'pendiente'}</span></td>
                `;
                tbody.appendChild(fila);
            });
        });
    </script>
</body>
</html>
