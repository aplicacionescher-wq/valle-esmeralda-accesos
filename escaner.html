<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Caseta - Valle Esmeralda</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            padding: 20px;
            text-align: center;
            background: var(--card);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        #reader {
            width: 100%;
            max-width: 450px;
            border: none !important;
            margin-top: 20px;
        }

        #resultado {
            width: 90%;
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            display: none;
            box-sizing: border-box;
        }

        .controles {
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        button {
            padding: 16px;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-pendientes {
            background: var(--warning);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-reset {
            background: #475569;
            color: white;
        }

        .btn-salir {
            background: transparent;
            color: #64748b;
            border: 1px solid #334155;
        }

        /* Estilos para el visor de la cámara */
        #reader__scan_region { background: #000; }
    </style>
</head>
<body>

    <header>
        <h2 style="margin:0; color:var(--success)">🛡️ Control de Caseta</h2>
        <p style="margin:5px 0 0 0; color:#94a3b8; font-size:0.9rem;">Escanee el código del visitante</p>
    </header>

    <div id="reader"></div>

    <div id="resultado"></div>

    <div class="controles">
        <button class="btn-pendientes" onclick="location.href='pendientes.html'">
            ⏳ Ver Visitas Por Llegar
        </button>

        <button class="btn-reset" onclick="reiniciarEscaneo()">
            🔄 Limpiar / Nuevo Escaneo
        </button>

        <button class="btn-salir" onclick="location.href='dashboard.html'">
            ⬅ Volver al Menú
        </button>
    </div>

    <script type="module" src="scanner.js"></script>

    <script>
        let html5QrCode;

        async function iniciarCamara() {
            html5QrCode = new Html5Qrcode("reader");
            const config = { 
                fps: 20, 
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0 
            };

            try {
                await html5QrCode.start(
                    { facingMode: "environment" }, 
                    config, 
                    (decodedText) => {
                        html5QrCode.pause();
                        if (window.onScanSuccess) {
                            window.onScanSuccess(decodedText);
                        }
                    }
                );
            } catch (err) {
                alert("Error al abrir cámara. Asegúrese de dar permisos.");
            }
        }

        window.reiniciarEscaneo = function() {
            const resDiv = document.getElementById("resultado");
            resDiv.style.display = "none";
            resDiv.innerHTML = "";
            if (html5QrCode) {
                html5QrCode.resume();
            }
        };

        window.onload = iniciarCamara;
    </script>
</body>
</html>
