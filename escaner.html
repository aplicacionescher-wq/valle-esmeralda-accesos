<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Escáner QR</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family: Arial;
background:#0f172a;
color:white;
text-align:center;
padding:20px;
}

h2{
margin-bottom:10px;
}

button{
width:90%;
max-width:300px;
padding:15px;
margin:10px;
font-size:18px;
border:none;
border-radius:10px;
background:#22c55e;
color:white;
cursor:pointer;
}

button:hover{
background:#16a34a;
}

#reader{
margin:auto;
width:300px;
margin-top:20px;
}

#resultado{
margin-top:20px;
font-size:18px;
}

img{
margin-top:10px;
border-radius:10px;
}

input{
margin-top:10px;
}

.card{
background:#1e293b;
padding:15px;
border-radius:15px;
margin-top:20px;
}

</style>

</head>

<body>

<h2>📷 Escanear QR</h2>

<button onclick="activarCamara()">Activar cámara</button>

<p id="mensaje"></p>

<div id="reader"></div>

<div class="card">

<div id="resultado"></div>

<div id="foto"></div>

<input type="file" id="fotoCaseta">

<br>

<button onclick="guardarFoto()">Guardar acceso</button>

</div>

<!-- Librería QR -->
<script src="https://unpkg.com/html5-qrcode"></script>

<!-- Tu lógica -->
<script type="module" src="scanner.js"></script>

</body>

</html>
