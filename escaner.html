<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scanner Acceso</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: black;
    color: white;
    text-align: center;
}

#reader {
    width: 100%;
}

#estado {
    position: fixed;
    bottom: 0;
    width: 100%;
    padding: 25px;
    font-size: 22px;
    font-weight: bold;
    background: #111;
}

.ok {
    background: #16a34a !important;
}

.error {
    background: #dc2626 !important;
}

.neutral {
    background: #111 !important;
}

.mensaje {
    font-size: 26px;
}

.sub {
    font-size: 16px;
    opacity: 0.8;
}
</style>

<!-- LIBRERÍA QR -->
<script src="https://unpkg.com/html5-qrcode"></script>

</head>

<body>

<div id="reader"></div>

<div id="estado" class="neutral">
    <div class="mensaje">📷 Escanea un código</div>
    <div class="sub">Esperando...</div>
</div>

<!-- SONIDOS -->
<audio id="okSound" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>
<audio id="errorSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script type="module">
import { db } from "./firebase.js";
import {
  doc,
  getDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

let activo = true;

const estadoDiv = document.getElementById("estado");
const okSound = document.getElementById("okSound");
const errorSound = document.getElementById("errorSound");

// 🔥 EXTRAER ID
function obtenerID(qrTexto) {
    try {
        if (qrTexto.includes("id=")) {
            const url = new URL(qrTexto);
            return url.searchParams.get("id");
        }
        return qrTexto;
    } catch {
        return null;
    }
}

// 🔥 UI
function mostrarOK(nombre, casa) {
    estadoDiv.className = "ok";
    estadoDiv.innerHTML = `
        <div class="mensaje">✅ ACCESO PERMITIDO</div>
        <div class="sub">${nombre} - Casa ${casa}</div>
    `;
    okSound.play();
    navigator.vibrate(200);
}

function mostrarError(msg) {
    estadoDiv.className = "error";
    estadoDiv.innerHTML = `
        <div class="mensaje">❌ ${msg}</div>
        <div class="sub">Intenta nuevamente</div>
    `;
    errorSound.play();
    navigator.vibrate([100, 100, 100]);
}

function resetUI() {
    estadoDiv.className = "neutral";
    estadoDiv.innerHTML = `
        <div class="mensaje">📷 Escanea un código</div>
        <div class="sub">Esperando...</div>
    `;
}

// 🔥 ESCÁNER
const html5QrCode = new Html5Qrcode("reader");

Html5Qrcode.getCameras().then(cameras => {

    let camaraTrasera = cameras.find(cam =>
        cam.label.toLowerCase().includes("back") ||
        cam.label.toLowerCase().includes("rear")
    );

    const camaraID = camaraTrasera ? camaraTrasera.id : cameras[0].id;

    html5QrCode.start(
        camaraID,
        { fps: 10, qrbox: 250 },

        async (decodedText) => {

            if (!activo) return;
            activo = false;

            const id = obtenerID(decodedText);

            if (!id) {
                mostrarError("QR inválido");
                return reset();
            }

            try {

                const ref = doc(db, "visitas", id);
                const snap = await getDoc(ref);

                if (!snap.exists()) {
                    mostrarError("No existe registro");
                    return reset();
                }

                const data = snap.data();

                if (data.estado === "usado") {
                    mostrarError("YA UTILIZADO");
                    return reset();
                }

                if (data.estado === "expirado") {
                    mostrarError("EXPIRADO");
                    return reset();
                }

                await updateDoc(ref, {
                    estado: "usado",
                    escaneadoEn: new Date().toLocaleString()
                });

                mostrarOK(data.nombre, data.casa);

            } catch (e) {
                mostrarError("Error conexión");
            }

            reset();

        }
    );

});

function reset() {
    setTimeout(() => {
        activo = true;
        resetUI();
    }, 3000);
}
</script>

</body>
</html>
