<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Escáner</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', Arial;
    background: #f5f5f5;
    text-align: center;
}

/* HEADER */
header {
    background: linear-gradient(90deg, #1e3a8a, #2563eb);
    color: white;
    padding: 15px;
    font-size: 18px;
}

/* BOTONES */
.topbar {
    display: flex;
    justify-content: space-around;
    padding: 10px;
}

.btn {
    background: #1e3a8a;
    color: white;
    padding: 10px 15px;
    border-radius: 10px;
    text-decoration: none;
    font-size: 14px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

/* SCANNER */
#reader {
    width: 100%;
    max-width: 400px;
    margin: auto;
}

/* RESULTADO */
#resultado {
    margin: 15px;
    padding: 15px;
    border-radius: 10px;
    font-weight: bold;
    background: white;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    transition: 0.3s;
}

.ok { border-left: 6px solid green; }
.error { border-left: 6px solid red; }
.warn { border-left: 6px solid orange; }
</style>

<!-- LIBRERÍA QR -->
<script src="https://unpkg.com/html5-qrcode"></script>

</head>

<body>

<header>
    📷 Escáner de Acceso
</header>

<div class="topbar">
    <a class="btn" href="index.html">⬅ Volver</a>
    <a class="btn" href="pendientes.html">📋 Pendientes</a>
</div>

<div id="reader"></div>

<div id="resultado">Esperando escaneo...</div>

<script type="module">
import { db } from "./firebase.js";
import {
  doc,
  getDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

let activo = true;
const resultado = document.getElementById("resultado");

// 🔥 FUNCIÓN CORRECTA PARA LEER ID
function obtenerID(texto) {
    try {
        if (!texto) return null;

        texto = texto.trim();
        console.log("QR COMPLETO:", texto);

        // Caso 1: URL con ?id=
        if (texto.includes("id=")) {
            const url = new URL(texto);
            const id = url.searchParams.get("id");
            console.log("ID EXTRAÍDO:", id);
            return id;
        }

        // Caso 2: URL tipo /visitas/ID
        if (texto.includes("/")) {
            const id = texto.split("/").pop();
            console.log("ID EXTRAÍDO:", id);
            return id;
        }

        // Caso 3: ID directo
        console.log("ID DIRECTO:", texto);
        return texto;

    } catch (e) {
        console.error("Error leyendo QR:", e);
        return null;
    }
}

// 🔥 UI
function setResultado(msg, tipo = "") {
    resultado.className = tipo;
    resultado.innerHTML = msg;
}

// 🔥 RESET
function reset() {
    setTimeout(() => {
        activo = true;
        setResultado("Esperando escaneo...");
    }, 2500);
}

// 🔥 ESCÁNER
const html5QrCode = new Html5Qrcode("reader");

Html5Qrcode.getCameras().then(cameras => {

    if (!cameras.length) {
        setResultado("❌ No hay cámara disponible", "error");
        return;
    }

    // 🔥 FORZAR CÁMARA TRASERA
    let camaraTrasera = cameras.find(cam =>
        cam.label.toLowerCase().includes("back") ||
        cam.label.toLowerCase().includes("rear")
    );

    const camaraID = camaraTrasera ? camaraTrasera.id : cameras[0].id;

    html5QrCode.start(
        camaraID,
        { fps: 10, qrbox: 250 },

        async (decodedText) => {

            if (!activo) return;
            activo = false;

            const id = obtenerID(decodedText);

            if (!id) {
                setResultado("❌ QR inválido", "error");
                return reset();
            }

            try {

                const idFinal = String(id).trim();
                console.log("ID FINAL:", idFinal);

                const ref = doc(db, "visitas", idFinal);
                const snap = await getDoc(ref);

                if (!snap.exists()) {
                    setResultado("❌ No existe registro", "error");
                    return reset();
                }

                const data = snap.data();

                if (data.estado === "usado") {
                    setResultado("⚠️ YA UTILIZADO", "warn");
                    return reset();
                }

                if (data.estado === "expirado") {
                    setResultado("❌ EXPIRADO", "error");
                    return reset();
                }

                await updateDoc(ref, {
                    estado: "usado",
                    escaneadoEn: new Date().toLocaleString()
                });

                setResultado(`
                    ✅ ACCESO PERMITIDO<br>
                    👤 ${data.nombre}<br>
                    🏠 Casa ${data.casa}
                `, "ok");

            } catch (e) {
                console.error(e);

                if (e.code === "unavailable") {
                    setResultado("🌐 Sin internet", "error");
                } else {
                    setResultado("❌ Error Firebase", "error");
                }
            }

            reset();
        }
    );

}).catch(err => {
    console.error(err);
    setResultado("❌ Error cámara", "error");
});
</script>

</body>
</html>
