<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Escáner</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f5f5f5;
    text-align: center;
}

/* HEADER */
header {
    background: #1e3a8a;
    color: white;
    padding: 15px;
    font-size: 18px;
}

/* BOTONES */
.topbar {
    display: flex;
    justify-content: space-around;
    padding: 10px;
}

.btn {
    background: #1e3a8a;
    color: white;
    padding: 10px 15px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
}

/* SCANNER */
#reader {
    width: 100%;
    max-width: 400px;
    margin: auto;
}

/* RESULTADO */
#resultado {
    margin-top: 15px;
    padding: 15px;
    font-weight: bold;
}
</style>

<!-- LIBRERÍA QR -->
<script src="https://unpkg.com/html5-qrcode"></script>

</head>

<body>

<header>
    📷 Escáner de Acceso
</header>

<div class="topbar">
    <a class="btn" href="index.html">⬅ Volver</a>
    <a class="btn" href="pendientes.html">📋 Ver Pendientes</a>
</div>

<div id="reader"></div>

<div id="resultado">Esperando escaneo...</div>

<script type="module">
import { db } from "./firebase.js";
import {
  doc,
  getDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

let activo = true;
const resultado = document.getElementById("resultado");

// 🔥 EXTRAER ID
function obtenerID(qrTexto) {
    try {
        if (qrTexto.includes("id=")) {
            const url = new URL(qrTexto);
            return url.searchParams.get("id");
        }
        return qrTexto;
    } catch {
        return null;
    }
}

// 🔥 ESCÁNER
const html5QrCode = new Html5Qrcode("reader");

Html5Qrcode.getCameras().then(cameras => {

    let camaraTrasera = cameras.find(cam =>
        cam.label.toLowerCase().includes("back") ||
        cam.label.toLowerCase().includes("rear")
    );

    const camaraID = camaraTrasera ? camaraTrasera.id : cameras[0].id;

    html5QrCode.start(
        camaraID,
        { fps: 10, qrbox: 250 },

        async (decodedText) => {

            if (!activo) return;
            activo = false;

            const id = obtenerID(decodedText);

            if (!id) {
                resultado.innerHTML = "❌ QR inválido";
                return reset();
            }

            try {

                const ref = doc(db, "visitas", id);
                const snap = await getDoc(ref);

                if (!snap.exists()) {
                    resultado.innerHTML = "❌ No existe registro";
                    return reset();
                }

                const data = snap.data();

                if (data.estado === "usado") {
                    resultado.innerHTML = "⚠️ YA UTILIZADO";
                    return reset();
                }

                if (data.estado === "expirado") {
                    resultado.innerHTML = "❌ EXPIRADO";
                    return reset();
                }

                await updateDoc(ref, {
                    estado: "usado",
                    escaneadoEn: new Date().toLocaleString()
                });

                resultado.innerHTML = `
                    ✅ ACCESO PERMITIDO <br>
                    👤 ${data.nombre} <br>
                    🏠 Casa ${data.casa}
                `;

            } catch (e) {
                resultado.innerHTML = "❌ Error de conexión";
            }

            reset();

        }
    );

});

// 🔥 RESET
function reset() {
    setTimeout(() => {
        activo = true;
        resultado.innerHTML = "Esperando escaneo...";
    }, 3000);
}
</script>

</body>
</html>
