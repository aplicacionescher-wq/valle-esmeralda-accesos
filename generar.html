<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar Acceso - Valle Esmeralda</title>

    <script>
        (function() {
            const sesion = localStorage.getItem("sesionActiva");
            const rol = localStorage.getItem("rol");
            // Si no hay sesión o el rol no es residente/admin, redirigir al login
            if (!sesion || (rol !== "residente" && rol !== "admin")) {
                window.location.replace("index.html");
            }
        })();
    </script>

    <style>
        :root {
            --primary: #1e293b;
            --accent: #00a99d;
            --bg: #f1f5f9;
        }

        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: var(--bg); 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }

        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            width: 90%; 
            max-width: 400px; 
            text-align: center;
        }

        h2 { color: var(--primary); margin-bottom: 25px; }

        .campo { text-align: left; margin-bottom: 20px; }
        
        .campo label { 
            display: block; 
            font-size: 11px; 
            font-weight: bold; 
            color: #64748b; 
            text-transform: uppercase; 
            margin-bottom: 5px; 
        }

        .campo input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #e2e8f0; 
            border-radius: 10px; 
            font-size: 16px; 
            box-sizing: border-box; 
        }

        .info-autorizacion {
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid #e2e8f0;
            text-align: left;
        }

        .info-autorizacion p {
            margin: 5px 0;
            font-size: 14px;
            color: var(--primary);
        }

        .info-autorizacion b { color: var(--accent); }

        .btn-generar { 
            width: 100%; 
            padding: 15px; 
            background: var(--primary); 
            color: #38bdf8; 
            border: none; 
            border-radius: 12px; 
            font-weight: bold; 
            font-size: 16px; 
            cursor: pointer; 
            transition: 0.3s;
        }

        .btn-generar:hover { background: var(--accent); color: white; }

        .btn-regresar {
            display: block;
            margin-top: 15px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Registrar Invitado</h2>

        <div class="info-autorizacion">
            <p>Casa (Usuario): <b id="display-casa">Cargando...</b></p>
            <p>Autoriza (Rol): <b id="display-rol">Cargando...</b></p>
        </div>

        <div class="campo">
            <label>Nombre del Invitado</label>
            <input type="text" id="nombreInvitado" placeholder="Ej: Juan Pérez">
        </div>

        <button class="btn-generar" id="btnGuardar">💾 Crear Registro de Acceso</button>

        <a href="dashboard.html" class="btn-regresar">← Volver al Panel</a>
    </div>

    <script type="module">
        import { db } from "./firebase.js";
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Recuperar datos de la sesión para mostrar y guardar
        const casaUsuario = localStorage.getItem("usuario") || "No identificado";
        const rolUsuario = localStorage.getItem("rol") || "residente";

        // Mostrar en pantalla los datos que solicitaste
        document.getElementById("display-casa").innerText = casaUsuario;
        document.getElementById("display-rol").innerText = rolUsuario.toUpperCase();

        document.getElementById("btnGuardar").onclick = async () => {
            const nombre = document.getElementById("nombreInvitado").value.trim();

            if (!nombre) {
                alert("Por favor, escribe el nombre del invitado.");
                return;
            }

            try {
                const btn = document.getElementById("btnGuardar");
                btn.innerText = "Guardando...";
                btn.disabled = true;

                // Guardar en Firebase con la estructura solicitada
                await addDoc(collection(db, "visitas"), {
                    nombre: nombre,
                    casa: casaUsuario,      // El usuario que inició sesión
                    autoriza: rolUsuario,   // El rol que inició sesión
                    timestamp: Date.now(),
                    estado: "pendiente",
                    tipo: "Visita"
                });

                alert("Acceso registrado correctamente.");
                window.location.href = "dashboard.html";

            } catch (error) {
                console.error("Error:", error);
                alert("Hubo un error al guardar.");
                document.getElementById("btnGuardar").innerText = "💾 Crear Registro de Acceso";
                document.getElementById("btnGuardar").disabled = false;
            }
        };
    </script>
</body>
</html>
