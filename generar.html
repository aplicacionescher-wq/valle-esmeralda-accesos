<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar Acceso - Valle Esmeralda</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; text-align: center; padding: 20px; }
        .container { background: #1e293b; padding: 20px; border-radius: 15px; max-width: 400px; margin: auto; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-gen { background: #22c55e; color: white; }
        .btn-wa { background: #25d366; color: white; margin-top: 20px; }
        /* Contenedor del QR */
        #qr { background: white; padding: 15px; display: inline-block; border-radius: 10px; margin-top: 20px; min-height: 200px; min-width: 200px; color: black; }
        #qr img { margin: 0 auto; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Generar Invitación</h2>
        <input type="text" id="nombre" placeholder="Nombre del invitado">
        <input type="tel" id="telefono" placeholder="WhatsApp (10 dígitos)">
        <select id="tipo">
            <option value="visita">Visita Familiar</option>
            <option value="uber">Uber / Didi</option>
            <option value="proveedor">Proveedor / Servicios</option>
            <option value="paqueteria">Paquetería</option>
        </select>

        <button class="btn-gen" onclick="crearQR()">✨ Generar Código QR</button>
        
        <div id="qr">Esperando datos...</div>

        <button class="btn-wa" onclick="enviarWhats()">📱 Enviar por WhatsApp</button>
        <button style="background:#64748b; color:white;" onclick="location.href='dashboard.html'">Volver</button>
    </div>

    <script type="module" src="qr.js"></script>
</body>
</html>
