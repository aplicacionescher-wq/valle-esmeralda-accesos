<h2>Generar Acceso</h2>

<input id="nombre" placeholder="Nombre visitante">

<input id="casa" placeholder="Número de casa">

<input id="autoriza" placeholder="Quién autoriza">

<select id="tipo">
<option value="visita">Visita</option>
<option value="proveedor">Proveedor</option>
<option value="uber">Uber</option>
<option value="paqueteria">Paquetería</option>
</select>

<button onclick="crearQR()">Generar QR</button>

<div id="qr"></div>

<button class="whatsapp" onclick="enviarWhats()">Enviar WhatsApp</button>

</div>

<script>

let datosQR = null

function crearQR(){

let nombre = document.getElementById("nombre").value
let casa = document.getElementById("casa").value
let autoriza = document.getElementById("autoriza").value
let tipo = document.getElementById("tipo").value

// VALIDACIÓN
if(!nombre || !casa || !autoriza){
alert("Completa todos los campos")
return
}

// CREAR DATA
datosQR = {
nombre,
casa,
autoriza,
tipo,
timestamp: Date.now()
}

// CODIFICAR
let encoded = btoa(JSON.stringify(datosQR))

// 🔥 IMPORTANTE PARA TU REPO
let url = location.origin + "/valle-esmeralda-accesos/verqr.html?data=" + encoded

// LIMPIAR QR
document.getElementById("qr").innerHTML = ""

// GENERAR QR
new QRCode(document.getElementById("qr"), {
text: url,
width: 200,
height: 200
})

}

// WHATSAPP
function enviarWhats(){

if(!datosQR){
alert("Genera el QR primero")
return
}

let encoded = btoa(JSON.stringify(datosQR))

let url = location.origin + "/valle-esmeralda-accesos/verqr.html?data=" + encoded

let mensaje = "Acceso:\n" + url

window.open("https://wa.me/?text=" + encodeURIComponent(mensaje))

}

</script>

</body>
</html>
