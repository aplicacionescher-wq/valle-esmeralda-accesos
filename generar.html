<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Generar QR</title>

<!-- ✅ LIBRERÍA QR BUENA -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{
font-family: Arial;
background:#111;
color:white;
text-align:center;
}

input, select{
margin:8px;
padding:10px;
width:90%;
border-radius:5px;
border:none;
}

button{
padding:12px;
width:95%;
background:#00ff99;
border:none;
border-radius:8px;
font-size:16px;
}

#qrcode{
margin-top:20px;
}
</style>

</head>

<body>

<h2>📱 Generar Acceso</h2>

<!-- 🔥 IDs CORRECTOS -->
<input type="text" id="nombre" placeholder="Nombre visitante">
<input type="text" id="casa" placeholder="Casa">

<select id="tipo">
<option value="visita">Visita</option>
<option value="proveedor">Proveedor</option>
<option value="uber">Uber</option>
<option value="paqueteria">Paquetería</option>
</select>

<button onclick="crearQR()">Generar QR</button>

<div id="qrcode"></div>

<script type="module" src="qr.js"></script>

</body>
</html>
