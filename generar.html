<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Generar QR</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
</head>

<body>

<h2>Generar QR</h2>

<input id="nombre" placeholder="Nombre"><br><br>
<input id="casa" placeholder="Casa"><br><br>
<input id="autoriza" placeholder="Autoriza"><br><br>

<select id="tipo">
<option value="visita">Visita</option>
<option value="proveedor">Proveedor</option>
<option value="uber">Uber</option>
<option value="paqueteria">Paquetería</option>
</select><br><br>

<button onclick="crearQR()">Generar QR</button>

<div id="qr"></div>

<script>

function crearQR(){

let nombre = document.getElementById("nombre").value
let casa = document.getElementById("casa").value
let autoriza = document.getElementById("autoriza").value
let tipo = document.getElementById("tipo").value

if(!nombre || !casa || !autoriza){
alert("Completa todo")
return
}

let data = {
nombre,
casa,
autoriza,
tipo,
timestamp: Date.now()
}

let encoded = btoa(JSON.stringify(data))

// 🔥 AJUSTA SI USAS GITHUB
let url = location.origin + "/valle-esmeralda-accesos/verqr.html?data=" + encoded

document.getElementById("qr").innerHTML = ""

new QRCode(document.getElementById("qr"), url)

}

</script>

</body>
</html>
