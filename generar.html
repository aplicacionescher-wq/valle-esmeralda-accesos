<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Generar Pase - Valle Esmeralda</title>
    
    <script>
        (function() {
            const sesion = localStorage.getItem("sesionActiva");
            const rol = localStorage.getItem("rol");
            if (!sesion || (rol !== "residente" && rol !== "admin")) {
                window.location.replace("index.html");
            }
        })();
    </script>

    <link rel="icon" href="data:,">

    <script src="qrcode.min.js"></script>
    <script src="html2canvas.min.js"></script>

    <style>
        :root {
            --primary: #22c55e;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --accent: #00a99d;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            margin: 0 0 10px 0;
            color: var(--primary);
            font-size: 1.6rem;
        }

        /* Información de quien genera el pase */
        .info-autorizacion {
            background: rgba(15, 23, 42, 0.5);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: left;
            border: 1px solid #334155;
        }

        .info-autorizacion p {
            margin: 4px 0;
            font-size: 13px;
            color: #94a3b8;
        }

        .info-autorizacion b { color: var(--accent); }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: #94a3b8;
            padding-left: 5px;
        }

        input, select {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus { border-color: var(--primary); outline: none; }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        .btn-gen { background-color: var(--primary); color: white; }
        .btn-gen:active { transform: scale(0.98); }
        .btn-gen:disabled { background-color: #334155; cursor: not-allowed; }

        .btn-whats {
            background-color: #25d366;
            color: white;
            display: none; 
            margin-top: 20px;
        }

        #qr-container {
            display: none;
            background: white;
            padding: 20px;
            border-radius: 16px;
            margin: 25px auto;
            width: fit-content;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        #qr-container canvas, #qr-container img { display: block; margin: 0 auto; }

        .loading-text {
            display: none;
            color: var(--primary);
            margin: 15px 0;
            font-weight: 500;
        }

        .btn-back {
            background: transparent;
            color: #64748b;
            text-decoration: none;
            margin-top: 15px;
            display: inline-block;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Crear Invitación</h2>
        
        <div class="info-autorizacion">
            <p>Casa (Usuario): <b id="display-casa">---</b></p>
            <p>Autoriza (Rol): <b id="display-rol">---</b></p>
        </div>
        
        <div class="form-group">
            <label>Nombre del Invitado</label>
            <input type="text" id="nombre" placeholder="Nombre completo" autocomplete="off">
        </div>

        <div class="form-group">
            <label>Tipo de visita</label>
            <select id="tipo">
                <option value="Visita Familiar">Visita Familiar</option>
                <option value="Uber/Didi">Servicio (Uber/Didi)</option>
                <option value="Proveedor">Proveedor / Mantenimiento</option>
                <option value="Paquetería">Paquetería</option>
            </select>
        </div>

        <div class="loading-text" id="loader">Conectando con Firebase...</div>

        <button class="btn btn-gen" id="btnGen">✨ Generar Código QR</button>

        <div id="qr-container">
            <div id="qr"></div>
        </div>

        <button class="btn btn-whats" id="btnWhats">📱 Compartir por WhatsApp</button>
        
        <a href="dashboard.html" class="btn-back">⬅ Volver al panel</a>
    </div>

    <script type="module">
        import { db } from "./firebase.js";
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Recuperar datos de sesión
        const casaSesion = localStorage.getItem("usuario") || "Sin Casa";
        const rolSesion = localStorage.getItem("rol") || "residente";

        // Mostrar en la tarjeta
        document.getElementById("display-casa").innerText = casaSesion;
        document.getElementById("display-rol").innerText = rolSesion.toUpperCase();

        const btnGen = document.getElementById("btnGen");
        const loader = document.getElementById("loader");

        btnGen.onclick = async () => {
            const nombre = document.getElementById("nombre").value.trim();
            const tipo = document.getElementById("tipo").value;

            if (!nombre) {
                alert("Escribe el nombre del invitado.");
                return;
            }

            try {
                btnGen.disabled = true;
                loader.style.display = "block";

                // 1. Guardar en Firebase con la estructura solicitada
                const docRef = await addDoc(collection(db, "visitas"), {
                    nombre: nombre,
                    tipo: tipo,
                    casa: casaSesion,      // Aquí se guarda el USUARIO
                    autoriza: rolSesion,   // Aquí se guarda el ROL
                    timestamp: Date.now(),
                    estado: "pendiente"
                });

                // 2. Generar el QR visualmente usando el ID del documento
                loader.innerText = "Generando QR...";
                document.getElementById("qr").innerHTML = "";
                new QRCode(document.getElementById("qr"), {
                    text: docRef.id,
                    width: 200,
                    height: 200,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });

                // 3. Mostrar interfaz de éxito
                document.getElementById("qr-container").style.display = "block";
                document.getElementById("btnWhats").style.display = "block";
                loader.style.display = "none";
                btnGen.style.display = "none";

            } catch (error) {
                console.error(error);
                alert("Error al conectar con la base de datos.");
                btnGen.disabled = false;
                loader.style.display = "none";
            }
        };

        // Lógica para enviar por WhatsApp
        document.getElementById("btnWhats").onclick = async () => {
            const container = document.getElementById("qr-container");
            const nombre = document.getElementById("nombre").value;
            
            // Convertimos el QR a imagen para que el usuario pueda guardarlo o enviarlo mejor
            const canvas = await html2canvas(container);
            const link = document.createElement('a');
            link.download = `Pase_${nombre}.png`;
            link.href = canvas.toDataURL();
            link.click();

            // Abrir WhatsApp con texto
            const msg = encodeURIComponent(`Hola ${nombre}, este es tu pase de acceso para Valle Esmeralda. Por favor muéstralo en caseta.`);
            window.open(`https://wa.me/?text=${msg}`, '_blank');
        };
    </script>
</body>
</html>
